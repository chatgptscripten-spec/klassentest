<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KlassenTest – Admin Dashboard</title>
<link rel="stylesheet" href="kt.css">
<style>
.admin-header {
  background: linear-gradient(135deg, #0d0f14, #1a1630);
  padding: 0 20px; height: 54px; display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid rgba(255,255,255,.08); flex-shrink: 0;
}
.admin-title { font-family: var(--display); font-size: 14px; font-weight: 800; color: #fff; }
.admin-sub { font-size: 10px; color: rgba(255,255,255,.35); margin-top: 1px; }

.tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--paper); flex-shrink: 0; }
.tab-btn {
  padding: 12px 18px; font-size: 13px; font-weight: 600;
  color: var(--ink3); border: none; background: transparent; cursor: pointer;
  border-bottom: 2px solid transparent; transition: all .15s;
  display: flex; align-items: center; gap: 6px; white-space: nowrap;
}
.tab-btn:hover { color: var(--ink2); background: var(--paper2); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-content { display: none; flex: 1; overflow-y: auto; padding: 22px 24px; }
.tab-content.active { display: block; }

.overview-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 20px; }
@media(max-width:900px){.overview-grid{grid-template-columns:repeat(2,1fr);}}

.secret-banner {
  background: linear-gradient(135deg, #1a1630, #2d2060);
  border-radius: var(--r2); padding: 14px 18px; margin-bottom: 18px;
  display: flex; align-items: center; gap: 12px;
  border: 1px solid rgba(91,60,245,.3);
}
.secret-banner-text { color: rgba(255,255,255,.75); font-size: 13px; line-height: 1.6; }
.secret-banner-text strong { color: #fff; }

.filter-bar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
.filter-bar select, .filter-bar input {
  padding: 8px 12px; border: 1.5px solid var(--border2); border-radius: 9px;
  font-family: var(--font); font-size: 13px; color: var(--ink); background: var(--paper);
}
.filter-bar select:focus, .filter-bar input:focus { outline: none; border-color: var(--accent); }

.teacher-row {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px;
  background: var(--paper); border: 1px solid var(--border); border-radius: var(--r);
  margin-bottom: 8px; transition: all .15s;
}
.teacher-row:hover { border-color: var(--accent-m); box-shadow: var(--shadow); }

.del-btn {
  padding: 5px 11px; border-radius: 7px; border: 1px solid var(--red-m);
  background: var(--red-l); color: var(--red); font-size: 11px; font-weight: 700;
  cursor: pointer; font-family: var(--font); transition: all .15s;
}
.del-btn:hover { background: var(--red); color: #fff; }

.sol-row {
  display: flex; align-items: flex-start; gap: 8px; padding: 8px 12px;
  border-radius: 8px; margin-bottom: 4px; font-size: 13px;
}
.sol-correct { background: var(--green-l); color: var(--green-d); border: 1px solid var(--green-m); }
.sol-wrong { background: var(--red-l); color: var(--red); border: 1px solid var(--red-m); }
.sol-neutral { background: var(--paper2); color: var(--ink3); border: 1px solid var(--border); }
</style>
</head>
<body style="min-height:100vh;display:flex;flex-direction:column">
<div class="admin-header">
  <div class="logo-mark">K</div>
  <div>
    <div class="admin-title">KlassenTest Admin</div>
    <div class="admin-sub">Vollzugriff auf alle Daten</div>
  </div>
  <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
    <span class="admin-badge">🔐 Administrator</span>
    <button class="btn btn-ghost btn-sm" style="border-color:rgba(255,255,255,.15);color:rgba(255,255,255,.5);background:transparent" onclick="exportAll()">📦 Export</button>
    <button class="btn btn-ghost btn-sm" style="border-color:rgba(255,255,255,.15);color:rgba(255,255,255,.5);background:transparent" onclick="logout()">← Abmelden</button>
  </div>
</div>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('overview')">📊 Übersicht</button>
  <button class="tab-btn" onclick="switchTab('tests')">📝 Alle Tests</button>
  <button class="tab-btn" onclick="switchTab('students')">🎒 Schüler</button>
  <button class="tab-btn" onclick="switchTab('teachers')">👩‍🏫 Lehrkräfte</button>
  <button class="tab-btn" onclick="switchTab('data')">🗄 Rohdaten</button>
</div>

<div style="flex:1;overflow:hidden;display:flex;flex-direction:column">
  <div class="tab-content active" id="tab-overview"></div>
  <div class="tab-content" id="tab-tests"></div>
  <div class="tab-content" id="tab-students"></div>
  <div class="tab-content" id="tab-teachers"></div>
  <div class="tab-content" id="tab-data"></div>
</div>

<div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-body"></div>
</div>

<script src="kt.js"></script>
<script>
if (!sessionStorage.getItem('kt_admin')) window.location.href = 'index.html';

let currentTab = 'overview';
function logout() { sessionStorage.removeItem('kt_admin'); window.location.href = 'index.html'; }
function closeModal() { document.getElementById('modal-bg').classList.remove('open'); }
function openModal(html) { document.getElementById('modal-body').innerHTML = html; document.getElementById('modal-bg').classList.add('open'); }

function switchTab(id) {
  const ids = ['overview','tests','students','teachers','data'];
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', ids[i]===id));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  currentTab = id;
  renderTab(id);
}

function renderTab(id) {
  const db = KT.get();
  if (id==='overview') renderOverview(db);
  if (id==='tests') renderTests(db);
  if (id==='students') renderStudents(db);
  if (id==='teachers') renderTeachers(db);
  if (id==='data') renderData(db);
}

function renderOverview(db) {
  const el = document.getElementById('tab-overview');
  const totalSubs = db.submissions.length;
  const corrected = db.submissions.filter(s=>s.corrected).length;
  const avgScore = (() => {
    let sum=0,count=0;
    db.submissions.forEach(s=>{const t=db.tests.find(x=>x.id===s.testId);if(!t)return;const sc=KT.calcScore(s,t);if(sc.total>0){sum+=sc.scored/sc.total*100;count++;}});
    return count>0?Math.round(sum/count):0;
  })();

  el.innerHTML = `
    <div class="secret-banner">
      <span style="font-size:22px">🔐</span>
      <div class="secret-banner-text"><strong>Admin-Vollzugriff aktiv.</strong> Du siehst alle Tests, Schülerantworten und Musterlösungen. Lehrkräfte und Schüler haben keinen Zugriff.</div>
    </div>
    <div class="overview-grid">
      <div class="stat-card"><div class="stat-val">${db.tests.length}</div><div class="stat-label">Tests gesamt</div></div>
      <div class="stat-card"><div class="stat-val" style="color:var(--green)">${db.tests.filter(t=>t.active).length}</div><div class="stat-label">Aktive Tests</div></div>
      <div class="stat-card"><div class="stat-val">${totalSubs}</div><div class="stat-label">Abgaben gesamt</div></div>
      <div class="stat-card"><div class="stat-val">${db.students.length}</div><div class="stat-label">Schüler</div></div>
      <div class="stat-card"><div class="stat-val">${corrected}/${totalSubs}</div><div class="stat-label">Korrigiert</div></div>
      <div class="stat-card"><div class="stat-val">${avgScore}%</div><div class="stat-label">⌀ Score</div></div>
      <div class="stat-card"><div class="stat-val">${db.teachers.length}</div><div class="stat-label">Lehrkräfte</div></div>
      <div class="stat-card"><div class="stat-val">${db.tests.filter(t=>t.ended).length}</div><div class="stat-label">Beendete Tests</div></div>
    </div>
    <div class="panel">
      <div class="panel-title">⚡ Letzte Aktivität</div>
      ${db.submissions.slice().reverse().slice(0,10).map(s=>{
        const t=db.tests.find(x=>x.id===s.testId);
        const sc=KT.calcScore(s,t);
        return `<div class="stu-row">
          <div class="stu-avatar">${s.studentName.charAt(0).toUpperCase()}</div>
          <div class="tc-info">
            <div class="stu-name">${KT.esc(s.studentName)}</div>
            <div style="font-size:11px;color:var(--ink3)">${t?KT.esc(t.title):'–'} · ${new Date(s.submittedAt).toLocaleString('de-DE')}</div>
          </div>
          <span class="badge ${s.corrected?'badge-green':'badge-amber'}">${s.corrected?'✓ Korrigiert':'⏳ Offen'}</span>
          <span class="badge badge-gray">${sc.scored}/${sc.total} Pt.</span>
          ${s.grade?`<span class="badge badge-purple">Note ${KT.esc(s.grade)}</span>`:''}
        </div>`;
      }).join('')||'<div style="color:var(--ink3);font-size:13px;padding:8px">Noch keine Abgaben.</div>'}
    </div>`;
}

function renderTests(db) {
  const el = document.getElementById('tab-tests');
  el.innerHTML = `<div class="filter-bar">
    <input type="text" id="ts" placeholder="🔍 Test suchen…" oninput="filterTests()" style="min-width:220px">
    <select id="tf" onchange="filterTests()">
      <option value="">Alle Status</option>
      <option value="active">🟢 Aktiv</option>
      <option value="ended">🔴 Beendet</option>
      <option value="draft">⚪ Entwurf</option>
    </select>
  </div><div id="tlist"></div>`;
  filterTests();
}

function filterTests() {
  const db=KT.get();
  const q=(document.getElementById('ts')?.value||'').toLowerCase();
  const st=document.getElementById('tf')?.value||'';
  let tests=db.tests.slice().reverse();
  if(q) tests=tests.filter(t=>t.title.toLowerCase().includes(q)||(t.teacherName||'').toLowerCase().includes(q));
  if(st==='active') tests=tests.filter(t=>t.active);
  if(st==='ended') tests=tests.filter(t=>t.ended);
  if(st==='draft') tests=tests.filter(t=>!t.active&&!t.ended);
  const el=document.getElementById('tlist');
  if(!el)return;
  el.innerHTML = tests.map(t=>{
    const subs=db.submissions.filter(s=>s.testId===t.id);
    const qn=(t.blocks||[]).filter(b=>['mc','multi','free'].includes(b.type)).length;
    return `<div class="test-card">
      <div class="tc-icon">📝</div>
      <div class="tc-info">
        <div class="tc-name">${KT.esc(t.title)}</div>
        <div class="tc-meta">👩‍🏫 ${KT.esc(t.teacherName||'–')} · ${t.subject||'–'} · Klasse ${t.cls||'–'} · ${qn} Fragen · ${subs.length} Abgaben</div>
        <div style="margin-top:5px;display:flex;gap:5px;flex-wrap:wrap">
          <span class="badge ${t.active?'badge-green':t.ended?'badge-red':'badge-gray'}">${t.active?'🟢 Aktiv':t.ended?'🔴 Beendet':'⚪ Entwurf'}</span>
          ${t.joinCode?`<code style="font-family:var(--mono);font-size:11px;background:var(--paper2);padding:2px 8px;border-radius:5px;color:var(--ink3)">Code: ${t.joinCode}</code>`:''}
        </div>
      </div>
      <div class="tc-btns">
        <button class="btn btn-ghost btn-sm" onclick="viewTest('${t.id}')">👁 Ansicht</button>
        <button class="btn btn-ghost btn-sm" onclick="viewSolutions('${t.id}')">🔑 Lösung</button>
        <button class="btn btn-ghost btn-sm" onclick="viewAnswers('${t.id}')">📊 Antworten</button>
        <button class="del-btn" onclick="deleteTest('${t.id}')">🗑</button>
      </div>
    </div>`;
  }).join('')||'<div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">Kein Test gefunden.</div></div>';
}

function viewTest(id) {
  const db=KT.get();const t=db.tests.find(x=>x.id===id);if(!t)return;
  const qb=(t.blocks||[]).filter(b=>['mc','multi','free'].includes(b.type));
  openModal(`<div class="modal-head">📝 ${KT.esc(t.title)} <button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="secret-banner" style="margin-bottom:14px"><span style="font-size:18px">🔐</span><div class="secret-banner-text"><strong>Admin-Ansicht:</strong> Vollständiger Test inkl. Musterlösung</div></div>
    <div style="font-size:13px;color:var(--ink3);margin-bottom:14px;line-height:1.8">
      👩‍🏫 ${KT.esc(t.teacherName||'–')} · ${KT.esc(t.subject||'–')} · Klasse ${KT.esc(t.cls||'–')}<br>
      Erstellt: ${new Date(t.createdAt).toLocaleString('de-DE')} · Code: <code style="font-family:var(--mono)">${t.joinCode||'–'}</code>
    </div>
    ${qb.map((b,i)=>`<div class="corr-q-row">
      <div class="corr-q-label">${b.type==='mc'?'Einfachauswahl':b.type==='multi'?'Mehrfachauswahl':'Freie Antwort'} – Frage ${i+1} (${b.data.points||1} Pt.)</div>
      <div style="font-weight:600;margin-bottom:8px">${KT.esc(b.data.question)}</div>
      ${b.type==='mc'?b.data.options.map((o,oi)=>`<div class="sol-row ${oi===b.data.correctIndex?'sol-correct':'sol-neutral'}">${oi===b.data.correctIndex?'✅ RICHTIG':`○ ${oi+1}`} &nbsp; ${KT.esc(o)}</div>`).join('')
      :b.type==='multi'?b.data.options.map((o,oi)=>`<div class="sol-row ${(b.data.correctIndexes||[]).includes(oi)?'sol-correct':'sol-neutral'}">${(b.data.correctIndexes||[]).includes(oi)?'✅ RICHTIG':`☐ ${oi+1}`} &nbsp; ${KT.esc(o)}</div>`).join('')
      :`<div style="font-size:12px;color:var(--ink3);font-style:italic;padding:8px">Freie Antwort – manuelle Korrektur</div>`}
    </div>`).join('')}
    <div style="text-align:right;margin-top:14px"><button class="btn btn-ghost" onclick="closeModal()">Schließen</button></div>`);
}

function viewSolutions(id) {
  const db=KT.get();const t=db.tests.find(x=>x.id===id);if(!t)return;
  const qb=(t.blocks||[]).filter(b=>['mc','multi','free'].includes(b.type));
  let html=`<div class="modal-head">🔑 Musterlösung <button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="secret-banner" style="margin-bottom:14px"><span style="font-size:18px">🔒</span><div class="secret-banner-text"><strong>${KT.esc(t.title)}</strong> — Nur für Administrator sichtbar</div></div>`;
  qb.forEach((b,i)=>{
    html+=`<div class="corr-q-row">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div class="corr-q-label">Frage ${i+1}: ${KT.esc(b.data.question)}</div>
        <span class="badge badge-gray">${b.data.points||1} Pt.</span>
      </div>`;
    if(b.type==='mc'){
      b.data.options.forEach((o,oi)=>{html+=`<div class="sol-row ${oi===b.data.correctIndex?'sol-correct':'sol-neutral'}"><span style="font-weight:700;min-width:80px">${oi===b.data.correctIndex?'✅ RICHTIG':`○ Option ${oi+1}`}</span>${KT.esc(o)}</div>`;});
    } else if(b.type==='multi'){
      b.data.options.forEach((o,oi)=>{const ok=(b.data.correctIndexes||[]).includes(oi);html+=`<div class="sol-row ${ok?'sol-correct':'sol-neutral'}"><span style="font-weight:700;min-width:80px">${ok?'✅ RICHTIG':`☐ Option ${oi+1}`}</span>${KT.esc(o)}</div>`;});
    } else {
      html+=`<div style="padding:8px;font-size:12px;color:var(--ink3);font-style:italic">Freie Antwort – kein festes Muster</div>`;
    }
    html+=`</div>`;
  });
  html+=`<div style="text-align:right;margin-top:14px"><button class="btn btn-ghost" onclick="closeModal()">Schließen</button></div>`;
  openModal(html);
}

function viewAnswers(id) {
  const db=KT.get();const t=db.tests.find(x=>x.id===id);if(!t)return;
  const subs=db.submissions.filter(s=>s.testId===id);
  const qb=(t.blocks||[]).filter(b=>['mc','multi','free'].includes(b.type));
  if(!subs.length){alert('Noch keine Abgaben.');return;}
  let html=`<div class="modal-head">📊 Alle Antworten <button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="secret-banner" style="margin-bottom:14px"><span style="font-size:18px">👁</span><div class="secret-banner-text"><strong>${KT.esc(t.title)}</strong> — ${subs.length} Abgaben</div></div>`;
  subs.forEach(sub=>{
    const sc=KT.calcScore(sub,t);
    const pct=sc.total>0?Math.round(sc.scored/sc.total*100):0;
    html+=`<div style="background:var(--paper2);border-radius:var(--r2);padding:14px;margin-bottom:10px;border:1px solid var(--border)">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap">
        <div class="stu-avatar">${sub.studentName.charAt(0).toUpperCase()}</div>
        <div><div style="font-weight:700;font-size:13px">${KT.esc(sub.studentName)}</div><div style="font-size:11px;color:var(--ink3)">${new Date(sub.submittedAt).toLocaleString('de-DE')} · ${sc.scored}/${sc.total} Pt. (${pct}%)</div></div>
        ${sub.grade?`<span class="badge badge-purple" style="margin-left:auto">Note ${KT.esc(sub.grade)}</span>`:''}
        <span class="badge ${sub.corrected?'badge-green':'badge-amber'}">${sub.corrected?'✓ Korrigiert':'⏳ Offen'}</span>
      </div>
      ${qb.map((b,i)=>{
        const ans=sub.answers?.[b.id];
        let ad='',correct=false;
        if(b.type==='mc'){correct=ans===b.data.correctIndex;ad=ans!=null?`"${KT.esc(b.data.options[ans])}"`:'';}
        else if(b.type==='multi'){const ca=JSON.stringify([...(b.data.correctIndexes||[])].sort((a,c)=>a-c));const ga=JSON.stringify([...(ans||[])].sort((a,c)=>a-c));correct=ca===ga;ad=(ans||[]).map(idx=>`"${KT.esc(b.data.options[idx])}"`).join(', ')||'–';}
        else{ad=ans?KT.esc(ans):'–';}
        return `<div style="margin-bottom:6px">
          <div style="font-size:11px;font-weight:700;color:var(--ink3);margin-bottom:3px">F${i+1}: ${KT.esc(b.data.question)}${b.type!=='free'?` <span style="color:${correct?'var(--green)':'var(--red)'}">${correct?'✅':'❌'}</span>`:''}</div>
          <div class="answer-peek">${ad||'–'}</div>
        </div>`;
      }).join('')}
    </div>`;
  });
  html+=`<div style="text-align:right;margin-top:14px"><button class="btn btn-ghost" onclick="closeModal()">Schließen</button></div>`;
  openModal(html);
}

function deleteTest(id) {
  if(!confirm('Test und alle Abgaben löschen? Nicht rückgängig!'))return;
  const db=KT.get();
  db.tests=db.tests.filter(t=>t.id!==id);
  db.submissions=db.submissions.filter(s=>s.testId!==id);
  KT.set(db);KT.toast('🗑 Test gelöscht.');filterTests();
}

function renderStudents(db) {
  const el=document.getElementById('tab-students');
  el.innerHTML=`<div class="filter-bar"><input type="text" id="ss" placeholder="🔍 Schüler suchen…" oninput="filterStudents()" style="min-width:220px"></div><div id="slist"></div>`;
  filterStudents();
}

function filterStudents() {
  const db=KT.get();
  const q=(document.getElementById('ss')?.value||'').toLowerCase();
  let students=db.students.filter(s=>!q||s.name.toLowerCase().includes(q));
  const el=document.getElementById('slist');if(!el)return;
  el.innerHTML=students.map(stu=>{
    const subs=db.submissions.filter(s=>s.studentName===stu.name);
    return `<div class="test-card" style="flex-direction:column;align-items:flex-start;gap:10px">
      <div style="display:flex;align-items:center;gap:12px;width:100%">
        <div class="stu-avatar" style="width:42px;height:42px;font-size:15px">${stu.name.charAt(0).toUpperCase()}</div>
        <div class="tc-info">
          <div class="tc-name">${KT.esc(stu.name)}</div>
          <div class="tc-meta">Zuletzt: ${stu.lastSeen?new Date(stu.lastSeen).toLocaleString('de-DE'):'–'} · ${subs.length} Abgabe${subs.length!==1?'n':''}</div>
        </div>
        <div class="tc-btns">
          <button class="btn btn-ghost btn-sm" onclick="viewStudentDetail('${encodeURIComponent(stu.name)}')">📊 Detail</button>
          <button class="del-btn" onclick="deleteStudent('${encodeURIComponent(stu.name)}')">🗑</button>
        </div>
      </div>
      ${subs.length?`<div style="width:100%;padding-top:8px;border-top:1px solid var(--border)">
        <div style="font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Abgaben</div>
        <div style="display:flex;gap:5px;flex-wrap:wrap">
          ${subs.map(sub=>{const t=db.tests.find(x=>x.id===sub.testId);const sc=KT.calcScore(sub,t);return`<span class="badge ${sub.corrected?'badge-green':'badge-amber'}" style="cursor:pointer">${t?KT.esc(t.title.slice(0,18)):'?'} · ${sc.scored}/${sc.total}${sub.grade?' · Note '+KT.esc(sub.grade):''}</span>`;}).join('')}
        </div>
      </div>`:''}
    </div>`;
  }).join('')||'<div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">Kein Schüler gefunden.</div></div>';
}

function viewStudentDetail(name) {
  const db=KT.get();const n=decodeURIComponent(name);
  const subs=db.submissions.filter(s=>s.studentName===n);
  let html=`<div class="modal-head">🎒 ${KT.esc(n)} <button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="secret-banner" style="margin-bottom:14px"><span style="font-size:18px">👁</span><div class="secret-banner-text">Vollständige Abgabehistorie inkl. aller Antworten</div></div>`;
  if(!subs.length){html+='<div style="color:var(--ink3)">Noch keine Abgaben.</div>';}
  subs.forEach(sub=>{
    const t=db.tests.find(x=>x.id===sub.testId);
    const sc=KT.calcScore(sub,t);
    const qb=t?(t.blocks||[]).filter(b=>['mc','multi','free'].includes(b.type)):[];
    html+=`<div class="corr-q-row">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px">
        <div><div style="font-weight:700">${t?KT.esc(t.title):'–'}</div><div style="font-size:12px;color:var(--ink3)">${new Date(sub.submittedAt).toLocaleString('de-DE')} · ${sc.scored}/${sc.total} Pt.</div></div>
        <div style="display:flex;gap:5px">${sub.grade?`<span class="badge badge-purple">Note ${KT.esc(sub.grade)}</span>`:''}<span class="badge ${sub.corrected?'badge-green':'badge-amber'}">${sub.corrected?'✓ Korrigiert':'⏳ Offen'}</span></div>
      </div>
      ${qb.map((b,i)=>{
        const ans=sub.answers?.[b.id];
        let at='';
        if(b.type==='mc')at=ans!=null?KT.esc(b.data.options[ans]):'–';
        else if(b.type==='multi')at=(ans||[]).map(idx=>KT.esc(b.data.options[idx])).join(', ')||'–';
        else at=KT.esc(ans||'–');
        const correct=b.type==='mc'?ans===b.data.correctIndex:b.type==='multi'?JSON.stringify([...(b.data.correctIndexes||[])].sort())===JSON.stringify([...(ans||[])].sort()):null;
        return `<div style="margin-bottom:6px;padding:9px 12px;border-radius:8px;background:var(--paper);border:1px solid var(--border)">
          <div style="font-size:11px;font-weight:700;color:var(--ink3);margin-bottom:3px">F${i+1}: ${KT.esc(b.data.question)}${correct!==null?`<span style="margin-left:6px;color:${correct?'var(--green)':'var(--red)'}">${correct?'✅':'❌'}</span>`:''}</div>
          <div style="font-size:13px;color:var(--ink2)">${at}</div>
        </div>`;
      }).join('')}
    </div>`;
  });
  html+=`<div style="text-align:right;margin-top:14px"><button class="btn btn-ghost" onclick="closeModal()">Schließen</button></div>`;
  openModal(html);
}

function deleteStudent(name) {
  if(!confirm('Schüler und alle Abgaben löschen?'))return;
  const n=decodeURIComponent(name);const db=KT.get();
  db.students=db.students.filter(s=>s.name!==n);
  db.submissions=db.submissions.filter(s=>s.studentName!==n);
  KT.set(db);KT.toast('🗑 Schüler gelöscht.');renderStudents(db);
}

function renderTeachers(db) {
  const el=document.getElementById('tab-teachers');
  if(!db.teachers.length){el.innerHTML='<div class="empty"><div class="empty-icon">👩‍🏫</div><div class="empty-text">Noch keine Lehrkräfte.</div></div>';return;}
  el.innerHTML=`<div class="panel"><div class="panel-title">Alle Lehrkräfte</div>
    ${db.teachers.map(t=>{
      const tests=db.tests.filter(x=>x.teacherName===t.name);
      const subs=db.submissions.filter(s=>tests.find(x=>x.id===s.testId));
      return`<div class="teacher-row">
        <div class="stu-avatar" style="background:var(--green-l);color:var(--green)">${t.name.charAt(0).toUpperCase()}</div>
        <div class="tc-info"><div class="stu-name">${KT.esc(t.name)}</div><div style="font-size:12px;color:var(--ink3)">${tests.length} Tests · ${subs.length} Abgaben · Zuletzt: ${t.lastSeen?new Date(t.lastSeen).toLocaleString('de-DE'):'–'}</div></div>
        <button class="btn btn-ghost btn-sm" onclick="viewTeacherTests('${encodeURIComponent(t.name)}')">Tests ansehen</button>
        <button class="del-btn" onclick="deleteTeacher('${encodeURIComponent(t.name)}')">🗑</button>
      </div>`;
    }).join('')}
  </div>`;
}

function viewTeacherTests(name) {
  const db=KT.get();const n=decodeURIComponent(name);
  const tests=db.tests.filter(t=>t.teacherName===n);
  let html=`<div class="modal-head">👩‍🏫 ${KT.esc(n)} <button class="modal-close" onclick="closeModal()">✕</button></div>
    <div style="font-size:13px;color:var(--ink3);margin-bottom:14px">${tests.length} Tests erstellt</div>`;
  tests.forEach(t=>{
    const subs=db.submissions.filter(s=>s.testId===t.id);
    html+=`<div class="test-card"><div class="tc-icon">📝</div><div class="tc-info"><div class="tc-name">${KT.esc(t.title)}</div><div class="tc-meta">${subs.length} Abgaben · ${new Date(t.createdAt).toLocaleDateString('de-DE')}</div></div><button class="btn btn-ghost btn-sm" onclick="closeModal();viewAnswers('${t.id}')">Antworten</button></div>`;
  });
  if(!tests.length)html+='<div style="color:var(--ink3)">Noch keine Tests.</div>';
  html+=`<div style="text-align:right;margin-top:14px"><button class="btn btn-ghost" onclick="closeModal()">Schließen</button></div>`;
  openModal(html);
}

function deleteTeacher(name) {
  if(!confirm('Lehrkraft löschen?'))return;
  const n=decodeURIComponent(name);const db=KT.get();
  db.teachers=db.teachers.filter(t=>t.name!==n);
  KT.set(db);KT.toast('🗑 Lehrkraft gelöscht.');renderTeachers(db);
}

function renderData(db) {
  const raw=JSON.stringify(db,null,2);
  document.getElementById('tab-data').innerHTML=`<div class="panel">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <div class="panel-title" style="margin-bottom:0">🗄 Rohdaten (localStorage)</div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost btn-sm" onclick="exportAll()">📦 Export JSON</button>
        <button class="btn btn-red btn-sm" onclick="resetAll()">⚠️ Zurücksetzen</button>
      </div>
    </div>
    <div style="font-size:12px;color:var(--ink3);margin-bottom:10px">Tests: ${db.tests.length} · Schüler: ${db.students.length} · Abgaben: ${db.submissions.length} · Lehrkräfte: ${db.teachers.length}</div>
    <textarea style="width:100%;height:400px;font-family:var(--mono);font-size:11px;padding:12px;border:1.5px solid var(--border);border-radius:var(--r);background:var(--paper2);color:var(--ink2);resize:vertical" readonly>${KT.esc(raw)}</textarea>
    <div style="margin-top:12px">
      <div class="f-label" style="font-size:10px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px">JSON importieren</div>
      <textarea id="import-area" style="width:100%;height:120px;font-family:var(--mono);font-size:11px;padding:12px;border:1.5px solid var(--border);border-radius:var(--r);resize:vertical;color:var(--ink);background:var(--paper)" placeholder="JSON hier einfügen…"></textarea>
      <button class="btn btn-amber btn-sm" style="margin-top:8px" onclick="importData()">📥 Importieren</button>
    </div>
  </div>`;
}

function exportAll() {
  KT.dl('klassentest-export-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(KT.get(),null,2),'application/json');
  KT.toast('📦 Export gespeichert.');
}

function resetAll() {
  if(!confirm('ACHTUNG: Alle Daten löschen? Nicht rückgängig!'))return;
  if(!confirm('Wirklich? Alle Daten gehen verloren!'))return;
  localStorage.removeItem('klassentest_v3');
  KT.toast('✅ Zurückgesetzt.');renderTab('overview');
}

function importData() {
  const raw=document.getElementById('import-area')?.value?.trim();if(!raw)return;
  try {
    const data=JSON.parse(raw);
    if(!data.tests||!data.students){alert('Ungültiges Format.');return;}
    KT.set(data);KT.toast('📥 Importiert!');renderTab(currentTab);
  } catch(e){alert('JSON-Fehler: '+e.message);}
}

renderTab('overview');
</script>
</body>
</html>
