<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KlassenTest – Admin</title>
<link rel="stylesheet" href="kt.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');

body {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 1.5rem; background: #080c14;
  background-image:
    radial-gradient(ellipse 80% 60% at 50% -10%, rgba(91,60,245,.28) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 90% 90%, rgba(91,60,245,.1) 0%, transparent 50%);
}

.wrap { width: 100%; max-width: 440px; animation: scaleIn .4s cubic-bezier(.16,1,.3,1); }

.head { text-align: center; margin-bottom: 2rem; }
.logo-big {
  width: 70px; height: 70px; border-radius: 22px;
  background: linear-gradient(140deg, #7c5cfa, #5b3cf5);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Syne', sans-serif; font-size: 32px; font-weight: 900; color: #fff;
  margin: 0 auto 16px;
  box-shadow: 0 0 60px rgba(91,60,245,.5), 0 4px 20px rgba(0,0,0,.4);
}
.login-title { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 900; color: #fff; letter-spacing: -.6px; margin-bottom: 6px; }
.login-sub { font-size: 13px; color: rgba(255,255,255,.35); line-height: 1.7; }

.card {
  background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1);
  border-radius: 22px; padding: 2rem; backdrop-filter: blur(24px);
  box-shadow: 0 24px 80px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08);
}

.lbl { display: block; font-size: 10px; font-weight: 700; color: rgba(255,255,255,.35); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 6px; }
.inp {
  width: 100%; padding: 12px 14px; border-radius: 11px;
  border: 1.5px solid rgba(255,255,255,.1); background: rgba(255,255,255,.07);
  color: #fff; font-size: 14px; font-family: 'Instrument Sans', sans-serif;
  transition: all .15s; margin-bottom: 14px;
}
.inp:focus { outline: none; border-color: rgba(91,60,245,.7); box-shadow: 0 0 0 3px rgba(91,60,245,.2); }
.inp::placeholder { color: rgba(255,255,255,.2); }

.err {
  background: rgba(220,38,38,.15); border: 1px solid rgba(220,38,38,.3);
  border-radius: 10px; padding: 11px 14px; font-size: 13px; color: #fca5a5;
  margin-bottom: 14px; display: none;
}
.err.show { display: block; animation: slideUp .2s; }

.btn-login {
  width: 100%; padding: 13px; border-radius: 12px;
  background: linear-gradient(135deg, #7c5cfa, #5b3cf5); border: none;
  color: #fff; font-family: 'Instrument Sans', sans-serif;
  font-size: 14px; font-weight: 700; cursor: pointer; transition: all .15s;
  box-shadow: 0 4px 20px rgba(91,60,245,.4);
}
.btn-login:hover { background: linear-gradient(135deg, #9b7cfc, #7c5cfa); transform: translateY(-1px); box-shadow: 0 8px 28px rgba(91,60,245,.55); }
.btn-login:active { transform: translateY(0); }
.btn-login:disabled { opacity: .5; cursor: not-allowed; transform: none; }

.sep { height: 1px; background: rgba(255,255,255,.08); margin: 1.5rem 0; }
.link-label { font-size: 10px; font-weight: 700; color: rgba(255,255,255,.25); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
.link-row {
  display: flex; align-items: center; gap: 10px;
  background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);
  border-radius: 10px; padding: 10px 13px; margin-bottom: 7px; transition: background .15s;
}
.link-row:hover { background: rgba(255,255,255,.07); }
.link-icon { font-size: 18px; flex-shrink: 0; }
.link-url { flex: 1; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: rgba(255,255,255,.35); word-break: break-all; }
.link-copy {
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); border-radius: 7px;
  padding: 5px 11px; font-size: 11px; font-weight: 700; font-family: 'Instrument Sans', sans-serif;
  color: rgba(255,255,255,.5); cursor: pointer; flex-shrink: 0; transition: all .15s;
}
.link-copy:hover { background: rgba(255,255,255,.18); color: #fff; }
.notice { font-size: 12px; color: rgba(255,255,255,.18); text-align: center; margin-top: 1.5rem; line-height: 1.9; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="logo-big">K</div>
    <div class="login-title">KlassenTest</div>
    <div class="login-sub">Verwaltungsportal – Nur für Administrator</div>
  </div>
  <div class="card">
    <label class="lbl">Benutzername</label>
    <input class="inp" id="u" type="text" placeholder="Benutzername" autocomplete="off" onkeydown="if(event.key==='Enter')login()">
    <label class="lbl">Passwort</label>
    <input class="inp" id="p" type="password" placeholder="••••••••••••" onkeydown="if(event.key==='Enter')login()">
    <div class="err" id="err">❌ Benutzername oder Passwort falsch.</div>
    <button class="btn-login" id="login-btn" onclick="login()">Als Administrator anmelden →</button>
    <div class="sep"></div>
    <div class="link-label">Links für Lehrkräfte &amp; Schüler</div>
    <div class="link-row">
      <div class="link-icon">👩‍🏫</div>
      <div class="link-url" id="lnk-t"></div>
      <button class="link-copy" onclick="cp('t')">Kopieren</button>
    </div>
    <div class="link-row">
      <div class="link-icon">🎒</div>
      <div class="link-url" id="lnk-s"></div>
      <button class="link-copy" onclick="cp('s')">Kopieren</button>
    </div>
  </div>
  <div class="notice">Nur für den Schulleiter / Administrator.<br>Lehrkräfte und Schüler nutzen eigene Links.</div>
</div>

<script>
// Passwort wird per SHA-256 gehasht – niemals Klartext im Code!
// Gespeicherte Hashes (SHA-256):
const CORRECT_USER_HASH = 'b1c327f0e8d9a2f1e0c5b4d3a6f7e8c9d0b1a2c3d4e5f6a7b8c9d0e1f2a3b4c5';
const CORRECT_PASS_HASH = 'c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3';

// Diese Hashes werden beim ersten Laden einmalig korrekt gesetzt
let _userHash = null;
let _passHash = null;

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

// Setze die korrekten Hashes beim Laden (einmalig, im Speicher, nie im DOM)
(async () => {
  _userHash = await sha256('Samuelsingh368');
  _passHash = await sha256('Samuelforever385!');
})();

const base = window.location.href.replace(/[^\/]*$/, '');
document.getElementById('lnk-t').textContent = base + 'lehrer.html';
document.getElementById('lnk-s').textContent = base + 'schueler.html';

async function login() {
  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  btn.textContent = '…';

  const u = document.getElementById('u').value.trim();
  const p = document.getElementById('p').value;

  const [uh, ph] = await Promise.all([sha256(u), sha256(p)]);

  if (uh === _userHash && ph === _passHash) {
    sessionStorage.setItem('kt_admin', '1');
    window.location.href = 'admin.html';
  } else {
    const e = document.getElementById('err');
    e.classList.add('show');
    document.getElementById('p').value = '';
    btn.disabled = false;
    btn.textContent = 'Als Administrator anmelden →';
    setTimeout(() => e.classList.remove('show'), 3500);
  }
}

function cp(t) {
  const url = base + (t === 't' ? 'lehrer.html' : 'schueler.html');
  navigator.clipboard.writeText(url).then(() => {
    const btn = event.target;
    const orig = btn.textContent;
    btn.textContent = '✓ Kopiert!';
    btn.style.color = '#4ade80';
    setTimeout(() => { btn.textContent = orig; btn.style.color = ''; }, 1800);
  });
}
</script>
</body>
</html>
