<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fusion – Lehreransicht</title>
<link rel="stylesheet" href="kt.css">
<style>
:root{--sb-w:236px}
body{min-height:100vh;overflow:hidden}
.app{display:flex;height:100vh;overflow:hidden}

/* SIDEBAR */
.sidebar{width:var(--sb-w);background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;position:relative}
.sidebar::before{content:'';position:absolute;top:0;left:0;right:0;height:220px;background:radial-gradient(ellipse at 50% 0%,rgba(99,102,241,.18) 0%,transparent 70%);pointer-events:none}
.sb-head{padding:18px 16px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);position:relative}
.sb-logo-text{font-size:15px;font-weight:900;color:var(--ink);letter-spacing:-.4px}
.sb-logo-sub{font-size:10px;color:var(--ink3);margin-top:1px}
.nav{flex:1;overflow-y:auto;padding:10px 8px}
.nb{width:100%;padding:9px 12px;border-radius:var(--r);border:none;background:transparent;color:var(--ink3);font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:9px;transition:all .14s;text-align:left;white-space:nowrap}
.nb:hover{background:var(--bg3);color:var(--ink2)}
.nb.active{background:var(--accent-l);color:var(--accent2);border:1px solid var(--accent-m)}
.nb .ni{font-size:15px;flex-shrink:0}
.nb-sep{height:1px;background:var(--border);margin:6px 0}
.nb-label{font-size:9px;font-weight:800;letter-spacing:1.3px;color:var(--ink4);text-transform:uppercase;padding:6px 12px 3px}
.sb-footer{padding:12px 14px;border-top:1px solid var(--border)}
.sb-user{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sb-av{width:34px;height:34px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--accent),#9b83ff);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff}
.sb-uname{font-size:12px;font-weight:700;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-urole{font-size:10px;color:var(--ink4);margin-top:1px}
.btn-tut{width:100%;padding:7px;border-radius:8px;border:1px solid var(--border2);background:var(--accent-l);color:var(--accent2);font-family:var(--font);font-size:11px;font-weight:700;cursor:pointer;transition:all .14s;margin-bottom:6px}
.btn-tut:hover{background:var(--accent-m)}
.btn-logout{width:100%;padding:7px;border-radius:8px;border:1px solid var(--border2);background:transparent;color:var(--ink3);font-family:var(--font);font-size:11px;font-weight:600;cursor:pointer;transition:all .14s}
.btn-logout:hover{background:var(--red-l);border-color:var(--red-m);color:var(--red)}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.section{display:none;flex:1;flex-direction:column;overflow:hidden}
.section.active{display:flex}

/* TOPBAR */
.topbar{padding:0 24px;height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border);background:var(--bg2)}
.topbar-title{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--ink);display:flex;align-items:center;gap:10px}
.topbar-actions{display:flex;gap:6px;align-items:center}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--r);border:1px solid transparent;font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;transition:all .14s;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 16px rgba(99,102,241,.3)}
.btn-primary:hover{background:var(--accent-d);transform:translateY(-1px);box-shadow:0 6px 20px rgba(99,102,241,.45)}
.btn-ghost{background:var(--bg3);color:var(--ink2);border-color:var(--border2)}
.btn-ghost:hover{background:var(--bg4);border-color:var(--border3);color:var(--ink)}
.btn-green{background:var(--green);color:#fff;border-color:var(--green)}
.btn-green:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-red{background:var(--red);color:#fff;border-color:var(--red)}
.btn-red:hover{filter:brightness(1.1)}
.btn-amber{background:var(--amber);color:#fff;border-color:var(--amber)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}
.btn-lg{padding:12px 22px;font-size:15px;border-radius:var(--r2)}
.btn-full{width:100%;justify-content:center}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}

/* PAGE */
.page{flex:1;overflow-y:auto;padding:22px 24px}

/* PANELS */
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r3);padding:18px 20px;margin-bottom:14px}
.panel-title{font-size:10px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:14px;display:flex;align-items:center;gap:7px}

/* TEST CARD */
.test-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:8px;transition:all .14s}
.test-card:hover{border-color:var(--border2);background:var(--bg4)}
.tc-icon{font-size:22px;flex-shrink:0}
.tc-info{flex:1;min-width:0}
.tc-name{font-size:14px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-meta{font-size:11px;color:var(--ink3);margin-top:2px}
.tc-btns{display:flex;gap:5px;flex-wrap:wrap;flex-shrink:0}

/* FIELDS */
.field{margin-bottom:14px}
.field label,.f-label{display:block;font-size:10px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:10px 13px;border:1px solid var(--border2);border-radius:var(--r);font-family:var(--font);font-size:13px;color:var(--ink);background:var(--bg3);transition:border .14s,box-shadow .14s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.18)}
.field select option{background:var(--bg3)}

/* ALERTS */
.alert{padding:11px 14px;border-radius:var(--r);font-size:13px;line-height:1.6}
.alert-blue{background:rgba(59,130,246,.1);color:#93c5fd;border:1px solid rgba(59,130,246,.22)}
.alert-green{background:var(--green-l);color:var(--green);border:1px solid var(--green-m)}
.alert-amber{background:var(--amber-l);color:var(--amber);border:1px solid var(--amber-m)}
.alert-red{background:var(--red-l);color:var(--red);border:1px solid var(--red-m)}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.8);backdrop-filter:blur(10px);align-items:center;justify-content:center;padding:1rem}
.modal-bg.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r4);max-width:640px;width:100%;max-height:92vh;overflow-y:auto;padding:28px;box-shadow:var(--shadow3);animation:scaleIn .2s cubic-bezier(.16,1,.3,1)}
.modal-head{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--ink);margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.modal-close{background:var(--bg3);border:1px solid var(--border);border-radius:7px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;color:var(--ink3);transition:all .14s;flex-shrink:0}
.modal-close:hover{background:var(--red-l);border-color:var(--red-m);color:var(--red)}

/* EMPTY */
.empty{text-align:center;padding:60px 20px;color:var(--ink3)}
.empty-icon{font-size:52px;margin-bottom:14px;opacity:.35}
.empty-text{font-size:14px;line-height:1.8}

/* STU ROW */
.stu-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.stu-row:last-child{border-bottom:none}
.stu-name{flex:1;font-size:13px;font-weight:600;color:var(--ink2)}

/* LIVE */
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-m);animation:pulse 2s infinite;flex-shrink:0}
.live-bar{background:var(--bg);padding:16px 24px;display:flex;align-items:center;gap:28px;flex-wrap:wrap;border-bottom:1px solid var(--border);flex-shrink:0}
.live-stat{display:flex;flex-direction:column;gap:2px}
.live-stat-label{font-size:9px;font-weight:800;letter-spacing:1.2px;color:var(--ink4);text-transform:uppercase}
.live-stat-val{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--ink);line-height:1}
.timer-live{font-family:var(--mono);font-size:36px;font-weight:700;letter-spacing:3px;color:var(--ink);line-height:1}
.timer-live.warn{color:var(--amber)}
.timer-live.danger{color:var(--red);animation:blink .8s infinite}
.progress-bar{height:5px;background:var(--bg4);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .4s}
.code-pill{display:inline-block;background:var(--bg3);color:var(--ink);font-family:var(--mono);font-size:28px;font-weight:700;letter-spacing:8px;padding:14px 28px;border-radius:var(--r2);border:1px solid var(--border2);box-shadow:var(--shadow)}

/* PAGE BUILDER */
.builder-wrap{display:flex;flex:1;overflow:hidden}
.builder-tools{width:200px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);overflow-y:auto;padding:12px 10px}
.tool-section{margin-bottom:18px}
.tool-section-label{font-size:9px;font-weight:800;color:var(--ink4);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:8px;padding:0 2px}
.tool-btn{width:100%;padding:9px 12px;border-radius:var(--r);border:1px solid var(--border2);background:var(--bg3);color:var(--ink2);font-family:var(--font);font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .13s;margin-bottom:5px;text-align:left}
.tool-btn:hover{background:var(--bg4);border-color:var(--border3);color:var(--ink)}
.tool-btn .ti{font-size:14px;flex-shrink:0}
.page-tabs{display:flex;align-items:center;gap:6px;padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.page-tab{padding:6px 14px;border-radius:8px;border:1px solid var(--border2);background:var(--bg3);color:var(--ink3);font-family:var(--font);font-size:12px;font-weight:700;cursor:pointer;transition:all .13s;display:flex;align-items:center;gap:6px}
.page-tab:hover{background:var(--bg4);color:var(--ink2)}
.page-tab.active{background:var(--accent-l);border-color:var(--accent-m);color:var(--accent2)}
.page-tab .del-pg{margin-left:4px;opacity:.5;font-size:10px}
.page-tab .del-pg:hover{opacity:1;color:var(--red)}
.add-page-btn{padding:6px 12px;border-radius:8px;border:1px dashed var(--border2);background:transparent;color:var(--ink3);font-family:var(--font);font-size:12px;font-weight:700;cursor:pointer;transition:all .13s}
.add-page-btn:hover{border-color:var(--accent-m);color:var(--accent2);background:var(--accent-l)}
.canvas-scroll{flex:1;overflow:auto;background:var(--bg);padding:20px 16px}
.a4-page{width:794px;min-height:1123px;background:#fff;margin:0 auto;border-radius:3px;box-shadow:0 4px 40px rgba(0,0,0,.6);position:relative;overflow:hidden;padding:40px 48px}
.canvas-zoom-bar{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--bg3);border-bottom:1px solid var(--border);flex-shrink:0;font-size:11px;color:var(--ink3)}
.canvas-zoom-bar button{padding:3px 8px;border-radius:5px;border:1px solid var(--border2);background:var(--bg4);color:var(--ink3);cursor:pointer;font-size:11px;font-family:var(--font);font-weight:700;transition:all .13s}
.canvas-zoom-bar button:hover{background:var(--accent-l);border-color:var(--accent-m);color:var(--accent2)}
.a4-page.bg-lined{background-image:repeating-linear-gradient(transparent,transparent 27px,#b8c8de 27px,#b8c8de 28px);background-size:100% 28px}
.a4-page.bg-grid{background-image:linear-gradient(#dde6f4 1px,transparent 1px),linear-gradient(90deg,#dde6f4 1px,transparent 1px);background-size:24px 24px}
.a4-page.bg-dot{background-image:radial-gradient(circle,#b8c8de 1px,transparent 1px);background-size:20px 20px}
.page-el{position:relative;margin-bottom:12px;border:1.5px solid transparent;border-radius:6px;transition:border-color .13s}
.page-el:hover{border-color:rgba(99,102,241,.3)}
.page-el.selected{border-color:var(--accent)!important}
.el-ctrl{display:none;position:absolute;right:-1px;top:-1px;z-index:10;background:var(--accent);border-radius:0 6px 0 6px;padding:2px 4px;gap:2px}
.page-el:hover .el-ctrl,.page-el.selected .el-ctrl{display:flex}
.ec-btn{width:20px;height:20px;border-radius:4px;border:none;background:transparent;color:#fff;cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center;transition:background .13s}
.ec-btn:hover{background:rgba(255,255,255,.2)}
.el-text-content{outline:none;min-height:24px;color:#1a1a2e;word-break:break-word;cursor:text;line-height:28px}
.el-line{display:flex;align-items:center;gap:8px;padding:2px 0}
.el-line-label{color:#1a1a2e;font-weight:700;white-space:nowrap;flex-shrink:0}
.el-line-input{flex:1;border:none;border-bottom:1.5px solid #9db3c8;background:transparent;color:#1a1a2e;font-family:inherit;font-size:inherit;padding:2px 4px;line-height:24px;outline:none;min-width:60px}
.el-line-input:focus{border-bottom-color:#6366f1}
.el-image-wrap{position:relative}
.el-image-wrap img{max-width:100%;border-radius:4px;display:block}
.el-image-placeholder{min-height:120px;border:2px dashed #9db3c8;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#6b7280;font-size:13px;cursor:pointer;transition:all .13s;background:rgba(155,179,200,.06)}
.el-image-placeholder:hover{border-color:#6366f1;color:#6366f1;background:rgba(99,102,241,.05)}
.el-mc-wrap{padding:6px 0}
.el-mc-question{outline:none;font-weight:700;color:#1a1a2e;min-height:24px;margin-bottom:8px;line-height:28px}
.el-mc-hint{font-size:10px;color:#9db3c8;margin-bottom:8px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.el-mc-option{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.el-mc-circle{width:20px;height:20px;border-radius:50%;border:2px solid #9db3c8;cursor:pointer;flex-shrink:0;transition:all .13s;background:#fff}
.el-mc-circle.correct{background:#22d47e;border-color:#22d47e;box-shadow:0 0 0 3px rgba(34,212,126,.25)}
.el-mc-option-inp{flex:1;border:none;border-bottom:1px solid #d1dbe8;background:transparent;font-family:inherit;font-size:inherit;color:#1a1a2e;padding:2px 4px;outline:none}
.el-mc-option-inp:focus{border-bottom-color:#6366f1}
.el-multi-square{width:20px;height:20px;border-radius:5px;border:2px solid #9db3c8;cursor:pointer;flex-shrink:0;transition:all .13s;background:#fff}
.el-multi-square.correct{background:var(--amber,#f5a623);border-color:var(--amber,#f5a623);box-shadow:0 0 0 3px rgba(245,166,35,.25)}
.el-free-wrap{padding:4px 0}
.el-free-question{outline:none;font-weight:700;color:#1a1a2e;min-height:24px;margin-bottom:8px;line-height:28px}
.el-free-lines{width:100%;border:none;border-bottom:1px solid #d1dbe8;background:transparent;resize:none;font-family:inherit;font-size:inherit;color:#9db3c8;outline:none;line-height:28px}
.el-table-wrap{overflow-x:auto}
.el-table-wrap table{width:100%;border-collapse:collapse}
.el-table-wrap th,.el-table-wrap td{border:1px solid #b8c8de;padding:7px 10px;text-align:left}
.el-table-wrap th{background:rgba(99,102,241,.08)}
.el-table-wrap input{border:none;background:transparent;font-family:inherit;font-size:inherit;color:#1a1a2e;width:100%;outline:none}
.el-pts-badge{position:absolute;right:28px;top:6px;background:rgba(245,166,35,.15);border:1px solid rgba(245,166,35,.3);border-radius:12px;padding:2px 8px;font-size:10px;font-weight:800;color:#f5a623;display:flex;align-items:center;gap:3px}
.el-pts-inp{width:32px;background:transparent;border:none;font-family:var(--mono);font-size:10px;font-weight:800;color:#f5a623;text-align:center;outline:none}
.builder-props{width:200px;flex-shrink:0;background:var(--bg2);border-left:1px solid var(--border);overflow-y:auto;padding:12px 10px}
.props-title{font-size:10px;font-weight:800;color:var(--ink4);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.prop-row{margin-bottom:10px}
.prop-label{font-size:10px;font-weight:700;color:var(--ink3);margin-bottom:4px;display:block;text-transform:uppercase;letter-spacing:.5px}
.prop-inp,.prop-sel{width:100%;padding:7px 10px;border-radius:8px;border:1px solid var(--border2);background:var(--bg3);font-family:var(--font);font-size:12px;color:var(--ink)}
.prop-inp:focus,.prop-sel:focus{outline:none;border-color:var(--accent)}
.prop-sel option{background:var(--bg3)}
.prop-row-inline{display:flex;gap:6px;align-items:center}

/* ADMIN TABS */
.admin-tabs{display:flex;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0}
.atab{padding:12px 18px;font-size:12px;font-weight:700;color:var(--ink3);border:none;background:transparent;cursor:pointer;border-bottom:2px solid transparent;transition:all .14s;display:flex;align-items:center;gap:6px;white-space:nowrap;font-family:var(--font)}
.atab:hover{color:var(--ink2);background:var(--bg3)}
.atab.active{color:var(--accent2);border-bottom-color:var(--accent2)}
.atab-content{display:none;flex:1;overflow-y:auto;padding:22px 24px}
.atab-content.active{display:block}
.admin-header{background:linear-gradient(135deg,#0a0b12,#131422);padding:0 20px;height:54px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.07);flex-shrink:0}
.admin-title{font-family:var(--serif);font-style:italic;font-size:16px;font-weight:700;color:#fff}
.admin-sub{font-size:10px;color:rgba(255,255,255,.3);margin-top:1px}

/* SIG PAD */
.sig-wrap{border:1.5px solid var(--border2);border-radius:var(--r2);overflow:hidden;background:#fff;touch-action:none}
.sig-canvas{display:block;width:100%;cursor:crosshair;touch-action:none}
.sig-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg3);border-top:1px solid var(--border)}
.sig-color{width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:all .13s}
.sig-color.active{border-color:var(--accent2);box-shadow:0 0 0 2px rgba(99,102,241,.3)}
.sig-size{padding:3px 8px;border-radius:6px;border:1px solid var(--border2);background:var(--bg4);color:var(--ink3);font-size:11px;font-weight:700;cursor:pointer;font-family:var(--font);transition:all .13s}
.sig-size.active{background:var(--accent-l);border-color:var(--accent-m);color:var(--accent2)}

/* TUTORIAL */
.tut-overlay{position:fixed;inset:0;z-index:500;pointer-events:none}
.tut-overlay.on{pointer-events:all}
.tut-spotlight{position:fixed;border-radius:var(--r2);display:none;box-shadow:0 0 0 9999px rgba(0,0,0,.75),0 0 0 2px var(--accent2),0 0 24px rgba(99,102,241,.5);pointer-events:none;z-index:502;transition:all .32s cubic-bezier(.16,1,.3,1)}
.tut-bubble{position:fixed;z-index:503;display:none;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r3);padding:20px 22px;max-width:310px;box-shadow:var(--shadow3);pointer-events:all;animation:scaleIn .2s cubic-bezier(.16,1,.3,1)}
.tut-step-lbl{font-size:9px;font-weight:800;color:var(--accent2);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:5px}
.tut-emoji{font-size:30px;margin-bottom:8px;display:block}
.tut-ttl{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--ink);margin-bottom:7px}
.tut-desc{font-size:13px;color:var(--ink2);line-height:1.7;margin-bottom:14px}
.tut-nav{display:flex;align-items:center;gap:8px}
.tut-dots{display:flex;gap:4px;flex:1}
.tut-dot{width:5px;height:5px;border-radius:50%;background:var(--bg5);transition:all .2s}
.tut-dot.on{background:var(--accent2);width:16px;border-radius:3px}
.tut-skip-btn{position:fixed;top:14px;right:14px;z-index:504;display:none;background:var(--bg3);border:1px solid var(--border2);border-radius:9px;padding:7px 14px;font-size:11px;font-weight:700;cursor:pointer;color:var(--ink3);font-family:var(--font);transition:all .13s;pointer-events:all}
.tut-skip-btn:hover{background:var(--red-l);border-color:var(--red-m);color:var(--red)}

/* CORR */

<script>
let _teacher=null,_isAdmin=false;
let _pages=[{id:'p1',label:'Seite 1',blocks:[]}];
let _curPage=0,_editId=null,_selEl=null;
let _timerInt=null,_timerSecs=0,_paused=false;
let _pollInt=null,_modalLocked=false,_blockCtr=0;
const _seenTuts=new Set(JSON.parse(localStorage.getItem('fusion_seen_tuts')||'[]'));

function getStudentBaseUrl(){
  const u=window.location.href;
  return u.replace(/lehrer\.html.*$/,'schueler.html');
}

function init(){
  const subj=document.getElementById('c-subj');
  KT.SUBJECTS.forEach(s=>subj.innerHTML+=`<option value="${s}">${s}</option>`);
  const cls=document.getElementById('c-class');
  KT.CLASSES.forEach(c=>cls.innerHTML+=`<option value="${c}">${c}</option>`);
  cls.innerHTML+='<option value="_custom">✏️ Eigene eingeben…</option>';
  cls.addEventListener('change',()=>{
    const ci=document.getElementById('c-class-custom');
    ci.style.display=cls.value==='_custom'?'block':'none';
  });
  const t=KT.loadTeacher();
  if(t){_teacher=t;_isAdmin=t.isAdmin||false;applyTeacher();navTo('tests');}
  else showLoginModal();
}

function applyTeacher(){
  document.getElementById('sb-name').textContent=_teacher.name;
  document.getElementById('sb-av').textContent=_teacher.name.charAt(0).toUpperCase();
  document.getElementById('sb-role').textContent=_teacher.city||'Lehrkraft';
  if(_isAdmin){document.getElementById('sb-sub').textContent='🔐 Administrator';document.getElementById('nb-admin-wrap').style.display='block';}
}

/* LOGIN */
function showLoginModal(){
  _modalLocked=true;
  openModal(`<div class="modal-head" style="font-size:22px">👋 Als Lehrkraft anmelden</div>
    <div style="display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;margin-bottom:10px">
      <div class="field" style="margin:0"><label>Titel</label><select id="l-title" style="padding:10px 8px;border:1px solid var(--border2);border-radius:var(--r);background:var(--bg3);color:var(--ink);font-family:var(--font);font-size:13px">${KT.TITLES.map(t=>`<option>${t}</option>`).join('')}</select></div>
      <div class="field" style="margin:0"><label>Vorname</label><input type="text" id="l-first" style="padding:10px 12px;border:1px solid var(--border2);border-radius:var(--r);background:var(--bg3);color:var(--ink);font-family:var(--font);font-size:13px;width:100%"></div>
      <div class="field" style="margin:0"><label>Nachname</label><input type="text" id="l-last" style="padding:10px 12px;border:1px solid var(--border2);border-radius:var(--r);background:var(--bg3);color:var(--ink);font-family:var(--font);font-size:13px;width:100%"></div>
    </div>
    <div class="field"><label>2. Vorname (optional)</label><input type="text" id="l-mid" style="padding:10px 12px;border:1px solid var(--border2);border-radius:var(--r);background:var(--bg3);color:var(--ink);font-family:var(--font);font-size:13px;width:100%"></div>
    <div class="field"><label>Standort / Stadt</label><input type="text" id="l-city" style="padding:10px 12px;border:1px solid var(--border2);border-radius:var(--r);background:var(--bg3);color:var(--ink);font-family:var(--font);font-size:13px;width:100%"></div>
    <div class="field"><label>Passwort <span style="color:var(--red)">*</span></label><input type="password" id="l-pass" style="padding:10px 12px;border:1px solid var(--border2);border-radius:var(--r);background:var(--bg3);color:var(--ink);font-family:var(--font);font-size:13px;width:100%"></div>
    <div class="field"><label>Passwort bestätigen <span style="color:var(--red)">*</span></label><input type="password" id="l-pass2" style="padding:10px 12px;border:1px solid var(--border2);border-radius:var(--r);background:var(--bg3);color:var(--ink);font-family:var(--font);font-size:13px;width:100%"></div>
    <div id="l-err" class="alert alert-red" style="display:none;margin-bottom:12px"></div>
    <button class="btn btn-primary btn-full btn-lg" onclick="doLogin()">Weiter →</button>`);
  setTimeout(()=>document.getElementById('l-first')?.focus(),100);
}

async function doLogin(){
  const title=document.getElementById('l-title').value;
  const first=document.getElementById('l-first').value.trim();
  const mid=document.getElementById('l-mid').value.trim();
  const last=document.getElementById('l-last').value.trim();
  const city=document.getElementById('l-city').value.trim();
  const pass=document.getElementById('l-pass').value;
  const pass2=document.getElementById('l-pass2')?.value||'';
  const err=document.getElementById('l-err');
  err.style.display='none';
  if(!first||!last){err.textContent='❌ Bitte Vor- und Nachname eingeben.';err.style.display='block';return;}
  if(!city){err.textContent='❌ Bitte Standort / Stadt eingeben.';err.style.display='block';return;}
  if(!pass){err.textContent='❌ Bitte ein Passwort eingeben.';err.style.display='block';return;}
  const parts=[title,first];if(mid)parts.push(mid);parts.push(last);
  const fullName=parts.join(' ');
  const admin=await KT.checkAdmin(fullName,city,pass);
  const db=KT.get();
  let tRecord=db.teachers.find(t=>t.name===fullName&&(t.city||'').toLowerCase()===(city||'').toLowerCase());
  if(tRecord){
    if(tRecord.passHash){const ph=await KT.sha256(pass);if(ph!==tRecord.passHash){err.textContent='❌ Falsches Passwort.';err.style.display='block';return;}}
  }else{
    const dupName=db.teachers.find(t=>t.name.toLowerCase()===fullName.toLowerCase()&&(t.city||'').toLowerCase()===(city||'').toLowerCase());
    if(dupName){err.textContent='❌ Dieser Name ist bereits vergeben.';err.style.display='block';return;}
    if(pass!==pass2){err.textContent='❌ Passwörter stimmen nicht überein.';err.style.display='block';return;}
    if(pass.length<6){err.textContent='❌ Passwort muss mind. 6 Zeichen haben.';err.style.display='block';return;}
    tRecord={name:fullName,city,lastSeen:Date.now()};
    tRecord.passHash=await KT.sha256(pass);
    db.teachers.push(tRecord);
  }
  tRecord.lastSeen=Date.now();KT.set(db);
  _teacher={name:fullName,city,isAdmin:admin};_isAdmin=admin;
  KT.saveTeacher(_teacher);
  applyTeacher();_modalLocked=false;closeModal();navTo('tests');
  if(!_seenTuts.has('welcome'))setTimeout(()=>startTutorial('welcome'),700);
}

function doLogout(){KT.clearTeacher();window.location.reload();}

function showStudentLink(){
  const url=getStudentBaseUrl();
  window._stuUrl=url;
  openModal(`<div class="modal-head" style="font-size:18px">🔗 Schüler-Link</div>
    <div class="alert alert-blue" style="margin-bottom:14px">Diesen Link gibst du deinen Schülern. Sie öffnen ihn im Browser und geben den Test-Code ein.</div>
    <div class="link-display" onclick="navigator.clipboard.writeText('${url}').then(()=>KT.toast('📋 Link kopiert!'))" title="Klicken zum Kopieren">${KT.esc(url)}</div>
    <div style="font-size:12px;color:var(--ink3);margin-bottom:14px">💡 Klicke auf den Link zum Kopieren, oder nutze den Button unten.</div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-ghost" onclick="closeModal()">Schließen</button>
      <button class="btn btn-primary" onclick="navigator.clipboard.writeText(window._stuUrl).then(()=>KT.toast('📋 Link kopiert!'))">📋 Link kopieren</button>
    </div>`);
}

/* NAV */
function navTo(id){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('active'));
  document.getElementById('s-'+id).classList.add('active');
  const nb=document.getElementById('nb-'+id);if(nb)nb.classList.add('active');
  renderSection(id);
}
function renderSection(id){
  if(!_teacher)return;
  const db=KT.get();const mine=db.tests.filter(t=>t.teacherName===_teacher.name);
  if(id==='tests')renderTests(mine,db);
  if(id==='create')renderCreate(db);
  if(id==='live')renderLive(mine,db);
  if(id==='subs')renderSubs(mine,db);
  if(id==='correct')renderCorrect(mine,db);
  if(id==='admin')renderAdmin(db);
}

/* TESTS LIST */
function renderTests(mine,db){
  const el=document.getElementById('tests-list');
  if(!mine.length){el.innerHTML=`<div class="empty"><div class="empty-icon">📭</div><div class="empty-text">Noch keine Tests.<br><button class="btn btn-primary" style="margin-top:14px" onclick="navTo('create')">✦ Ersten Test erstellen</button></div></div>`;return;}
  el.innerHTML=mine.slice().reverse().map(t=>{
    const subs=db.submissions.filter(s=>s.testId===t.id).length;
    const qCount=(t.pages||[]).reduce((a,p)=>a+(p.blocks||[]).filter(b=>['mc','multi','free'].includes(b.type)).length,0);
    return`<div class="test-card">
      <div class="tc-icon">📝</div>
      <div class="tc-info">
        <div class="tc-name">${KT.esc(t.title)}</div>
        <div class="tc-meta">${KT.esc(t.subject||'')} ${t.cls?'· Klasse '+KT.esc(t.cls):''} · ${qCount} Frage${qCount!==1?'n':''} · ${subs} Abgabe${subs!==1?'n':''} · ${(t.pages||[]).length} Seite${(t.pages||[]).length!==1?'n':''}</div>
        ${t.active?`<div style="margin-top:4px"><code style="font-family:var(--mono);font-size:12px;background:var(--bg4);padding:2px 9px;border-radius:6px;color:var(--ink3)">Code: ${t.joinCode}</code></div>`:''}
      </div>
      <div class="tc-btns">
        <span class="badge ${t.active?'badge-green':t.ended?'badge-red':'badge-gray'}">${t.active?'🟢 Aktiv':t.ended?'🔴 Beendet':'⚪ Entwurf'}</span>
        ${!t.active&&!t.ended?`<button class="btn btn-ghost btn-sm" onclick="loadEdit('${t.id}')">✏️ Bearbeiten</button>`:''}
        ${!t.active&&!t.ended?`<button class="btn btn-green btn-sm" onclick="startTestById('${t.id}')">▶ Starten</button>`:''}
        ${t.active?`<button class="btn btn-primary btn-sm" onclick="navTo('live')">🟢 Live</button>`:''}
        ${t.active?`<button class="btn btn-red btn-sm" onclick="endTest('${t.id}')">⏹</button>`:''}
      </div>
    </div>`;
  }).join('');
}

/* CREATE */
function renderCreate(db){
  const mine=db.tests.filter(t=>t.teacherName===_teacher.name&&!t.active&&!t.ended);
  const dl=document.getElementById('drafts-list');
  if(dl)dl.innerHTML=mine.length?mine.map(t=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)"><span style="font-size:12px;color:var(--ink2);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px">${KT.esc(t.title)}</span><button class="btn btn-ghost btn-sm" style="flex-shrink:0" onclick="loadEdit('${t.id}')">Öffnen</button></div>`).join(''):'<div style="font-size:12px;color:var(--ink4)">Keine Entwürfe.</div>';
  renderPageTabs();renderPage();
}

function renderPageTabs(){
  const el=document.getElementById('page-tabs');
  el.innerHTML=_pages.map((pg,i)=>`<div class="page-tab ${i===_curPage?'active':''}" onclick="switchPage(${i})">${KT.esc(pg.label)}${_pages.length>1?`<span class="del-pg" onclick="event.stopPropagation();deletePage(${i})">✕</span>`:''}</div>`).join('')+`<button class="add-page-btn" onclick="addPage()">+ Seite</button>`;
}
function switchPage(i){_curPage=i;renderPageTabs();renderPage();}
function addPage(){_pages.push({id:KT.gid(),label:`Seite ${_pages.length+1}`,blocks:[]});_curPage=_pages.length-1;renderPageTabs();renderPage();}
function deletePage(i){if(_pages.length<=1)return KT.toast('⚠️ Mindestens eine Seite!');if(!confirm(`Seite löschen?`))return;_pages.splice(i,1);if(_curPage>=_pages.length)_curPage=_pages.length-1;renderPageTabs();renderPage();}
function updatePageBg(){const v=document.getElementById('c-bg').value;const el=document.getElementById('a4-canvas');if(el)el.className=`a4-page bg-${v}`;}
let _canvasZoom=1;
function setZoom(z){_canvasZoom=z;const wrap=document.getElementById('a4-wrap');if(wrap)wrap.style.transform=`scale(${z})`;document.getElementById('zoom-label').textContent=Math.round(z*100)+'%';document.querySelectorAll('.canvas-zoom-bar button').forEach(b=>{b.style.background='';b.style.borderColor='';b.style.color='';});}

function renderPage(){
  const canvas=document.getElementById('a4-canvas');if(!canvas)return;
  updatePageBg();const pg=_pages[_curPage];if(!pg)return;
  canvas.innerHTML='';
  if(!pg.blocks.length){canvas.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;height:200px;color:#9db3c8;font-size:13px;pointer-events:none;user-select:none;gap:8px"><span style="opacity:.3;font-size:24px">✦</span>Elemente aus dem linken Panel einfügen</div>`;}
  else{pg.blocks.forEach((b,i)=>{const el=document.createElement('div');el.className='page-el';el.dataset.idx=i;el.innerHTML=blockToHTML(b,i);el.addEventListener('click',e=>{if(e.target.closest('.el-ctrl'))return;selectEl(i,el);});canvas.appendChild(el);});}
  attachBlockEvents();
}

function attachBlockEvents(){
  const pg=_pages[_curPage];
  document.querySelectorAll('.el-text-content').forEach(el=>{const idx=parseInt(el.closest('.page-el')?.dataset.idx);if(isNaN(idx))return;el.addEventListener('input',()=>{pg.blocks[idx].content=el.innerText;});});
  document.querySelectorAll('.el-mc-question').forEach(el=>{const idx=parseInt(el.closest('.page-el')?.dataset.idx);if(isNaN(idx))return;el.addEventListener('input',()=>{pg.blocks[idx].question=el.innerText;});});
  document.querySelectorAll('.el-free-question').forEach(el=>{const idx=parseInt(el.closest('.page-el')?.dataset.idx);if(isNaN(idx))return;el.addEventListener('input',()=>{pg.blocks[idx].question=el.innerText;});});
}

function selectEl(idx,domEl){document.querySelectorAll('.page-el').forEach(e=>e.classList.remove('selected'));domEl.classList.add('selected');_selEl=idx;renderProps(idx);}

function blockToHTML(b,i){
  const ctrl=`<div class="el-ctrl">${i>0?`<button class="ec-btn" onclick="moveEl(${i},-1)">↑</button>`:''} ${i<_pages[_curPage].blocks.length-1?`<button class="ec-btn" onclick="moveEl(${i},1)">↓</button>`:''}<button class="ec-btn" onclick="dupEl(${i})">⧉</button><button class="ec-btn" onclick="delEl(${i})" style="color:#f05252">✕</button></div>`;
  const fs=b.fontSize||14,fw=b.fontWeight||'normal',color=b.color||'#1a1a2e';
  if(b.type==='header')return ctrl+`<div class="el-text-content" contenteditable="true" spellcheck="false" style="font-size:${b.fontSize||22}px;font-weight:${b.fontWeight||800};color:${color};font-family:inherit;outline:none;min-height:32px;line-height:1.3">${KT.esc(b.content||'')}</div>`;
  if(b.type==='text')return ctrl+`<div class="el-text-content" contenteditable="true" spellcheck="false" style="font-size:${fs}px;font-weight:${fw};color:${color};outline:none;min-height:${b.minHeight||24}px">${KT.esc(b.content||'')}</div>`;
  if(b.type==='line')return ctrl+`<div class="el-line" style="font-size:${fs}px"><span class="el-line-label" style="font-weight:${fw};color:${color}">${KT.esc(b.label||'Name:')}</span><input class="el-line-input" type="text" placeholder="________" style="font-size:${fs}px" readonly></div>`;
  if(b.type==='divider')return ctrl+`<hr style="border:none;border-top:${b.thickness||1}px solid ${color};margin:6px 0;opacity:.4">`;
  if(b.type==='spacer')return ctrl+`<div style="height:${b.height||24}px"></div>`;
  if(b.type==='image'){if(b.src)return ctrl+`<div class="el-image-wrap"><img src="${b.src}" style="width:${b.width||100}%;border-radius:4px;cursor:pointer" onclick="pickImage(${i})"></div>`;return ctrl+`<div class="el-image-placeholder" onclick="pickImage(${i})">🖼 Klicken um Bild hochzuladen</div>`;}
  if(b.type==='mc')return ctrl+`<div class="el-pts-badge">⭐<input class="el-pts-inp" type="number" min="1" max="99" value="${b.points||1}" oninput="setPts(${i},+this.value)" onclick="event.stopPropagation()">Pt.</div><div class="el-mc-wrap" style="font-size:${fs}px"><div class="el-mc-question" contenteditable="true" spellcheck="false">${KT.esc(b.question||'')}</div><div class="el-mc-hint">○ = Richtig markieren</div>${(b.options||['','','']).map((o,oi)=>`<div class="el-mc-option"><div class="el-mc-circle ${oi===b.correctIndex?'correct':''}" onclick="event.stopPropagation();setMCCorrect(${i},${oi})"></div><input class="el-mc-option-inp" type="text" value="${KT.esc(o)}" placeholder="Antwort ${oi+1}…" oninput="_pages[_curPage].blocks[${i}].options[${oi}]=this.value" onclick="event.stopPropagation()" style="font-size:${fs}px">${(b.options||[]).length>2?`<button style="background:none;border:none;cursor:pointer;color:#f05252;font-size:12px" onclick="event.stopPropagation();delOpt(${i},${oi})">✕</button>`:''}</div>`).join('')}<button onclick="event.stopPropagation();addOpt(${i})" style="margin-top:6px;font-size:11px;font-weight:700;color:var(--accent2);background:var(--accent-l);border:1px solid var(--accent-m);border-radius:7px;padding:4px 10px;cursor:pointer;font-family:var(--font)">+ Option</button></div>`;
  if(b.type==='multi')return ctrl+`<div class="el-pts-badge">⭐<input class="el-pts-inp" type="number" min="1" max="99" value="${b.points||1}" oninput="setPts(${i},+this.value)" onclick="event.stopPropagation()">Pt.</div><div class="el-mc-wrap" style="font-size:${fs}px"><div class="el-mc-question" contenteditable="true" spellcheck="false">${KT.esc(b.question||'')}</div><div class="el-mc-hint" style="color:rgba(245,166,35,.7)">☐ = Mehrere richtige Antworten</div>${(b.options||['','','']).map((o,oi)=>`<div class="el-mc-option"><div class="el-multi-square ${(b.correctIndexes||[]).includes(oi)?'correct':''}" onclick="event.stopPropagation();toggleMultiCorrect(${i},${oi})"></div><input class="el-mc-option-inp" type="text" value="${KT.esc(o)}" placeholder="Antwort ${oi+1}…" oninput="_pages[_curPage].blocks[${i}].options[${oi}]=this.value" onclick="event.stopPropagation()" style="font-size:${fs}px">${(b.options||[]).length>2?`<button style="background:none;border:none;cursor:pointer;color:#f05252;font-size:12px" onclick="event.stopPropagation();delOpt(${i},${oi})">✕</button>`:''}</div>`).join('')}<button onclick="event.stopPropagation();addOpt(${i})" style="margin-top:6px;font-size:11px;font-weight:700;color:var(--amber);background:var(--amber-l);border:1px solid var(--amber-m);border-radius:7px;padding:4px 10px;cursor:pointer;font-family:var(--font)">+ Option</button></div>`;
  if(b.type==='free')return ctrl+`<div class="el-pts-badge">⭐<input class="el-pts-inp" type="number" min="1" max="99" value="${b.points||1}" oninput="setPts(${i},+this.value)" onclick="event.stopPropagation()">Pt.</div><div class="el-free-wrap" style="font-size:${fs}px"><div class="el-free-question" contenteditable="true" spellcheck="false">${KT.esc(b.question||'')}</div><textarea class="el-free-lines" rows="${b.lines||4}" placeholder="(Schüler schreiben hier)" style="font-size:${fs}px"></textarea></div>`;
  if(b.type==='table'){const rows=b.rows||3,cols=b.cols||3,hd=b.headers||Array.from({length:cols},(_,i)=>['Aufgabe','Punkte','Erhalten'][i]||`Sp. ${i+1}`),cells=b.cells||Array.from({length:rows},()=>Array(cols).fill(''));return ctrl+`<div class="el-table-wrap"><table><thead><tr>${hd.map((h,hi)=>`<th><input value="${KT.esc(h)}" oninput="_pages[_curPage].blocks[${i}].headers[${hi}]=this.value" onclick="event.stopPropagation()"></th>`).join('')}</tr></thead><tbody>${cells.map((row,ri)=>`<tr>${row.map((cell,ci)=>`<td><input value="${KT.esc(cell)}" oninput="_pages[_curPage].blocks[${i}].cells[${ri}][${ci}]=this.value" onclick="event.stopPropagation()"></td>`).join('')}</tr>`).join('')}</tbody></table><div style="margin-top:6px;display:flex;gap:5px"><button onclick="event.stopPropagation();addTableRow(${i})" style="padding:3px 8px;border:1px solid var(--border2);border-radius:6px;background:var(--bg4);cursor:pointer;font-size:11px;color:var(--ink2);font-family:var(--font)">+ Zeile</button><button onclick="event.stopPropagation();addTableCol(${i})" style="padding:3px 8px;border:1px solid var(--border2);border-radius:6px;background:var(--bg4);cursor:pointer;font-size:11px;color:var(--ink2);font-family:var(--font)">+ Spalte</button>${rows>1?`<button onclick="event.stopPropagation();delTableRow(${i})" style="padding:3px 8px;border:1px solid var(--red-m);border-radius:6px;background:var(--red-l);cursor:pointer;font-size:11px;color:var(--red);font-family:var(--font)">− Zeile</button>`:''}</div></div>`;}
  return ctrl+`<div style="padding:8px;color:var(--ink3);font-size:12px">Unbekannter Block</div>`;
}

function renderProps(idx){
  const pg=_pages[_curPage];const b=pg.blocks[idx];if(!b)return;
  const pp=document.getElementById('props-content');
  let html=`<div class="prop-row"><span class="prop-label">Typ</span><div style="font-size:12px;font-weight:700;color:var(--accent2)">${b.type.toUpperCase()}</div></div>`;
  if(['header','text','mc','multi','free'].includes(b.type)){
    html+=`<div class="prop-row"><span class="prop-label">Schriftgröße</span><div class="prop-row-inline"><input class="prop-inp" type="number" min="8" max="72" value="${b.fontSize||14}" oninput="setProp(${idx},'fontSize',+this.value)" style="width:60px"><span style="font-size:11px;color:var(--ink3)">px</span></div></div>`;
    html+=`<div class="prop-row"><span class="prop-label">Schriftgewicht</span><select class="prop-sel" onchange="setProp(${idx},'fontWeight',this.value)"><option value="normal" ${b.fontWeight==='normal'||!b.fontWeight?'selected':''}>Normal</option><option value="600" ${b.fontWeight==='600'?'selected':''}>Halbfett</option><option value="700" ${b.fontWeight==='700'?'selected':''}>Fett</option><option value="800" ${b.fontWeight==='800'?'selected':''}>Extra Fett</option><option value="900" ${b.fontWeight==='900'?'selected':''}>Schwarz</option></select></div>`;
    html+=`<div class="prop-row"><span class="prop-label">Farbe</span><input type="color" value="${b.color||'#1a1a2e'}" oninput="setProp(${idx},'color',this.value)" style="width:100%;height:34px;border-radius:8px;border:1px solid var(--border2);background:var(--bg3);cursor:pointer"></div>`;
  }
  if(b.type==='text')html+=`<div class="prop-row"><span class="prop-label">Min. Höhe (px)</span><input class="prop-inp" type="number" min="20" max="800" value="${b.minHeight||24}" oninput="setProp(${idx},'minHeight',+this.value)"></div>`;
  if(b.type==='free')html+=`<div class="prop-row"><span class="prop-label">Anzahl Zeilen</span><input class="prop-inp" type="number" min="1" max="30" value="${b.lines||4}" oninput="setPropAndRender(${idx},'lines',+this.value)"></div>`;
  if(['mc','multi'].includes(b.type))html+=`<div class="prop-row"><span class="prop-label">Punkte</span><input class="prop-inp" type="number" min="1" max="99" value="${b.points||1}" oninput="setPts(${idx},+this.value)"></div><div class="prop-row"><span class="prop-label">Anzahl Optionen</span><div class="prop-row-inline"><button class="btn btn-ghost btn-sm" onclick="addOpt(${idx})" style="padding:5px 10px">+</button><span style="font-size:12px;color:var(--ink2);font-weight:700">${(b.options||[]).length}</span><button class="btn btn-ghost btn-sm" onclick="delOpt(${idx},(${(b.options||[]).length}-1))" style="padding:5px 10px">−</button></div></div>`;
  if(b.type==='image')html+=`<div class="prop-row"><span class="prop-label">Breite (%)</span><input class="prop-inp" type="number" min="10" max="100" value="${b.width||100}" oninput="setPropAndRender(${idx},'width',+this.value)"></div><button class="btn btn-ghost btn-sm btn-full" onclick="pickImage(${idx})" style="margin-top:4px">🖼 Bild ändern</button>`;
  if(b.type==='spacer')html+=`<div class="prop-row"><span class="prop-label">Höhe (px)</span><input class="prop-inp" type="number" min="4" max="400" value="${b.height||24}" oninput="setPropAndRender(${idx},'height',+this.value)"></div>`;
  if(b.type==='divider')html+=`<div class="prop-row"><span class="prop-label">Stärke (px)</span><input class="prop-inp" type="number" min="1" max="10" value="${b.thickness||1}" oninput="setPropAndRender(${idx},'thickness',+this.value)"></div><div class="prop-row"><span class="prop-label">Farbe</span><input type="color" value="${b.color||'#9db3c8'}" oninput="setPropAndRender(${idx},'color',this.value)" style="width:100%;height:34px;border-radius:8px;border:1px solid var(--border2);background:var(--bg3);cursor:pointer"></div>`;
  html+=`<div style="margin-top:14px"><button class="btn btn-red btn-sm btn-full" onclick="delEl(${idx})">🗑 Element löschen</button></div>`;
  pp.innerHTML=html;
}

function setProp(idx,key,val){
  _pages[_curPage].blocks[idx][key]=val;
  const el=document.querySelector(`.page-el[data-idx="${idx}"]`);if(!el)return;
  const b=_pages[_curPage].blocks[idx];
  const tc=el.querySelector('.el-text-content,.el-mc-question,.el-free-question');
  if(tc){tc.style.fontSize=(b.fontSize||14)+'px';tc.style.fontWeight=b.fontWeight||'normal';tc.style.color=b.color||'#1a1a2e';}
}
function setPropAndRender(idx,key,val){_pages[_curPage].blocks[idx][key]=val;renderPage();setTimeout(()=>{const el=document.querySelector(`.page-el[data-idx="${idx}"]`);if(el)selectEl(idx,el);},10);}
function addEl(type){const id='el'+(++_blockCtr);_pages[_curPage].blocks.push(defaultBlock(type,id));renderPage();const tm={mc:'tut_mc',multi:'tut_multi',free:'tut_free',table:'tut_table',text:'tut_text',image:'tut_image',line:'tut_line'};if(tm[type]&&!_seenTuts.has(tm[type]))setTimeout(()=>startTutorial(tm[type]),300);}
function defaultBlock(type,id){
  const base={id,type};
  if(type==='header')return{...base,content:'Überschrift',fontSize:22,fontWeight:'800',color:'#1a1a2e'};
  if(type==='text')return{...base,content:'Text…',fontSize:14,fontWeight:'normal',color:'#1a1a2e',minHeight:24};
  if(type==='line')return{...base,label:'Name:',fontSize:14,fontWeight:'700',color:'#1a1a2e'};
  if(type==='divider')return{...base,thickness:1,color:'#9db3c8'};
  if(type==='spacer')return{...base,height:24};
  if(type==='image')return{...base,src:null,width:100};
  if(type==='mc')return{...base,question:'',options:['','','',''],correctIndex:0,points:1,fontSize:14};
  if(type==='multi')return{...base,question:'',options:['','','',''],correctIndexes:[],points:1,fontSize:14};
  if(type==='free')return{...base,question:'',lines:4,points:1,fontSize:14};
  if(type==='table')return{...base,rows:3,cols:3,headers:['Aufgabe','Punkte','Erhalten'],cells:Array.from({length:3},()=>Array(3).fill(''))};
  return base;
}
function moveEl(i,dir){const b=_pages[_curPage].blocks;const t=b.splice(i,1)[0];b.splice(i+dir,0,t);renderPage();}
function dupEl(i){const b=JSON.parse(JSON.stringify(_pages[_curPage].blocks[i]));b.id='el'+(++_blockCtr);_pages[_curPage].blocks.splice(i+1,0,b);renderPage();}
function delEl(i){_pages[_curPage].blocks.splice(i,1);_selEl=null;document.getElementById('props-content').textContent='Element auswählen…';renderPage();}
function setMCCorrect(bi,oi){_pages[_curPage].blocks[bi].correctIndex=oi;renderPage();}
function toggleMultiCorrect(bi,oi){const ci=_pages[_curPage].blocks[bi].correctIndexes||[];const idx=ci.indexOf(oi);if(idx>=0)ci.splice(idx,1);else ci.push(oi);_pages[_curPage].blocks[bi].correctIndexes=ci;renderPage();}
function addOpt(bi){_pages[_curPage].blocks[bi].options.push('');renderPage();}
function delOpt(bi,oi){_pages[_curPage].blocks[bi].options.splice(oi,1);renderPage();}
function setPts(bi,v){_pages[_curPage].blocks[bi].points=v;}
function addTableRow(bi){const b=_pages[_curPage].blocks[bi];b.rows++;b.cells.push(Array(b.cols).fill(''));renderPage();}
function addTableCol(bi){const b=_pages[_curPage].blocks[bi];b.cols++;b.headers.push('Sp.'+b.cols);b.cells.forEach(r=>r.push(''));renderPage();}
function delTableRow(bi){const b=_pages[_curPage].blocks[bi];if(b.rows<=1)return;b.rows--;b.cells.pop();renderPage();}
function pickImage(bi){const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{_pages[_curPage].blocks[bi].src=ev.target.result;renderPage();};r.readAsDataURL(f);};inp.click();}

function buildTest(){
  const title=document.getElementById('c-title')?.value.trim();if(!title){showCreateErr('Bitte Titel eingeben.');return null;}
  const subj=document.getElementById('c-subj')?.value;if(!subj){showCreateErr('Bitte Fach auswählen.');return null;}
  const clsEl=document.getElementById('c-class');const clsCustom=document.getElementById('c-class-custom');
  const cls=clsEl.value==='_custom'?clsCustom.value.trim():clsEl.value;
  const hasQ=_pages.some(pg=>pg.blocks.some(b=>['mc','multi','free'].includes(b.type)));
  if(!hasQ){showCreateErr('Füge mindestens eine Frage ein.');return null;}
  hideCreateErr();
  return{id:_editId||KT.gid(),title,subject:subj,cls,bg:document.getElementById('c-bg')?.value||'blank',teacherName:_teacher.name,teacherCity:_teacher.city,pages:JSON.parse(JSON.stringify(_pages)),joinCode:KT.genCode(),active:false,ended:false,createdAt:Date.now(),timerSeconds:1800};
}
function showCreateErr(m){const e=document.getElementById('create-err');if(e){e.textContent='❌ '+m;e.style.display='block';}}
function hideCreateErr(){const e=document.getElementById('create-err');if(e)e.style.display='none';}

function saveDraft(){const t=buildTest();if(!t)return;const db=KT.get();const idx=db.tests.findIndex(x=>x.id===t.id);if(idx>=0)db.tests[idx]=t;else db.tests.push(t);KT.set(db);_editId=t.id;KT.toast('💾 Entwurf gespeichert!');renderSection('create');}

function loadEdit(id){
  const db=KT.get();const t=db.tests.find(x=>x.id===id);if(!t)return;
  _editId=id;_pages=JSON.parse(JSON.stringify(t.pages||[{id:'p1',label:'Seite 1',blocks:[]}]));_curPage=0;navTo('create');
  setTimeout(()=>{
    const f=document.getElementById('c-title');if(f)f.value=t.title;
    const s=document.getElementById('c-subj');if(s)s.value=t.subject||'';
    const cls=document.getElementById('c-class');if(cls){if(KT.CLASSES.includes(t.cls))cls.value=t.cls;else{cls.value='_custom';const ci=document.getElementById('c-class-custom');if(ci){ci.value=t.cls;ci.style.display='block';}}}
    const bg=document.getElementById('c-bg');if(bg)bg.value=t.bg||'blank';
    document.getElementById('create-heading').textContent='✏️ Test bearbeiten';
    renderPageTabs();renderPage();
  },60);
}

function goStartSetup(){
  const t=buildTest();if(!t)return;
  const db=KT.get();const idx=db.tests.findIndex(x=>x.id===t.id);
  if(idx>=0)db.tests[idx]=t;else db.tests.push(t);KT.set(db);_editId=t.id;
  openModal(`<div class="modal-head">Test starten?</div><p style="font-size:14px;color:var(--ink2);margin-bottom:1.25rem;line-height:1.6">Test für Schüler freischalten?</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-ghost" onclick="closeModal()">← Weiter bearbeiten</button><button class="btn btn-primary" onclick="closeModal();showCodeSetup('${t.id}')">Ja, weiter →</button></div>`);
}

function showCodeSetup(testId){
  const db=KT.get();const t=db.tests.find(x=>x.id===testId);if(!t)return;
  if(!t.joinCode)t.joinCode=KT.genCode();KT.set(db);
  const stuUrl=getStudentBaseUrl()+'?code='+t.joinCode;
  openModal(`<div class="modal-head">⚙️ Code & Dauer</div>
    <div class="field"><label>Testdauer (Minuten)</label><input type="number" id="setup-mins" value="30" min="1" max="300" style="font-size:28px;font-weight:700;text-align:center;font-family:var(--mono);padding:14px;width:100%;border:1px solid var(--border2);border-radius:var(--r);background:var(--bg3);color:var(--ink)"></div>
    <div style="text-align:center;margin:1.5rem 0">
      <div style="font-size:10px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px">Zugangscode für Schüler</div>
      <div class="code-pill" id="code-display">${t.joinCode}</div>
      <div style="margin-top:10px"><button class="btn btn-ghost btn-sm" onclick="regenCode('${testId}')">🔄 Neu generieren</button></div>
    </div>
    <div class="alert alert-blue" style="margin-bottom:1.25rem">⚡ Schüler öffnen den <strong>Schüler-Link</strong> und geben diesen Code ein.</div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-ghost" onclick="closeModal()">Abbrechen</button>
      <button class="btn btn-green btn-lg" onclick="activateTest('${testId}')">🟢 Test starten</button>
    </div>`,true);
}

function regenCode(testId){const db=KT.get();const t=db.tests.find(x=>x.id===testId);if(!t)return;t.joinCode=KT.genCode();KT.set(db);const el=document.getElementById('code-display');if(el)el.textContent=t.joinCode;}

function activateTest(testId){
  const mins=parseInt(document.getElementById('setup-mins')?.value)||30;
  const db=KT.get();const t=db.tests.find(x=>x.id===testId);if(!t)return;

  },1000);

}

let _sigCtx=null,_sigDrawing=false,_sigColor='#000000',_sigSize=2;
function initSigPad(){
  const canvas=document.getElementById('sig-canvas');if(!canvas)return;
  const wrap=document.getElementById('sig-wrap');canvas.width=wrap.offsetWidth||560;
  _sigCtx=canvas.getContext('2d');_sigCtx.fillStyle='#ffffff';_sigCtx.fillRect(0,0,canvas.width,canvas.height);
  _sigCtx.strokeStyle=_sigColor;_sigCtx.lineWidth=_sigSize;_sigCtx.lineCap='round';_sigCtx.lineJoin='round';
  const gp=(e)=>{const r=canvas.getBoundingClientRect();const s=e.touches?e.touches[0]:e;return{x:(s.clientX-r.left)*(canvas.width/r.width),y:(s.clientY-r.top)*(canvas.height/r.height)};};
  const start=(e)=>{e.preventDefault();_sigDrawing=true;const p=gp(e);_sigCtx.beginPath();_sigCtx.moveTo(p.x,p.y);};
  const draw=(e)=>{e.preventDefault();if(!_sigDrawing)return;const p=gp(e);_sigCtx.lineTo(p.x,p.y);_sigCtx.stroke();};
  const stop=(e)=>{e.preventDefault();_sigDrawing=false;};
  canvas.addEventListener('mousedown',start);canvas.addEventListener('mousemove',draw);canvas.addEventListener('mouseup',stop);canvas.addEventListener('mouseleave',stop);
  canvas.addEventListener('touchstart',start,{passive:false});canvas.addEventListener('touchmove',draw,{passive:false});canvas.addEventListener('touchend',stop,{passive:false});
}
function setSigColor(c,btn){_sigColor=c;if(_sigCtx)_sigCtx.strokeStyle=c;document.querySelectorAll('.sig-color').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}
function setSigSize(s,btn){_sigSize=s;if(_sigCtx)_sigCtx.lineWidth=s;document.querySelectorAll('.sig-size').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}
function clearSig(){const c=document.getElementById('sig-canvas');if(!c||!_sigCtx)return;_sigCtx.fillStyle='#fff';_sigCtx.fillRect(0,0,c.width,c.height);}
function getSigData(){const c=document.getElementById('sig-canvas');if(!c)return null;const b=document.createElement('canvas');b.width=c.width;b.height=c.height;const bc=b.getContext('2d');bc.fillStyle='#fff';bc.fillRect(0,0,b.width,b.height);return c.toDataURL()===b.toDataURL()?null:c.toDataURL('image/png');}

function saveCorr(subId,send){
  const db=KT.get();const sub=db.submissions.find(s=>s.id===subId);const t=db.tests.find(x=>x.id===sub?.testId);if(!sub||!t)return;

  const qBlocks=[];(t.pages||[]).forEach(pg=>(pg.blocks||[]).forEach(b=>{if(['mc','multi','free'].includes(b.type))qBlocks.push(b);}));
  let fb=`<div style="background:var(--accent-l);border-radius:8px;padding:11px 14px;margin-bottom:10px;border:1px solid var(--accent-m)"><strong>Auto-Score:</strong> ${sc.scored}/${sc.total} Punkte</div>`;
  if(grade)fb+=`<div style="text-align:center;margin-bottom:14px"><div style="width:60px;height:60px;border-radius:50%;background:${KT.gradeColor(grade)};display:inline-flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#fff;margin-bottom:6px">${KT.esc(grade)}</div><div style="font-size:13px;font-weight:700">Deine Note</div></div>`;
  if(overall)fb+=`<div style="padding:12px;border-radius:9px;font-size:13px;line-height:1.7;margin-bottom:10px;border:1px solid var(--border)"><strong>Kommentar:</strong> ${KT.esc(overall)}</div>`;
  qBlocks.forEach(b=>{if(b.type==='free'){const p=document.getElementById('pts-'+b.id)?.value;const c=document.getElementById('cmt-'+b.id)?.value;if(p||c)fb+=`<div style="padding:9px 12px;border-radius:8px;margin-bottom:6px;font-size:13px;border:1px solid var(--border)"><strong>${KT.esc(b.question)}:</strong> ${p?p+' Pt.':''} ${c?'— '+KT.esc(c):''}</div>`;}});
  if(sigData)fb+=`<div style="margin-top:12px"><div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;color:var(--ink3)">Unterschrift:</div><img src="${sigData}" style="max-width:100%;border:1px solid var(--border);border-radius:8px;background:#fff"></div>`;
  if(grade)sub.grade=grade;sub.corrected=true;sub.returnedFeedback=fb;sub.correctedAt=Date.now();if(send)sub.sentBack=true;
  KT.set(db);closeModal();KT.toast(send?'✉️ Gesendet!':'💾 Gespeichert!');renderSection('subs');
}
function sendBack(subId){const db=KT.get();const sub=db.submissions.find(s=>s.id===subId);if(!sub)return;if(!sub.corrected){alert('Bitte zuerst korrigieren!');return;}sub.sentBack=true;KT.set(db);KT.toast('✉️ Gesendet!');renderSection('subs');}

function renderAOverview(db){
  const el=document.getElementById('at-overview');const ts=db.submissions.length,cor=db.submissions.filter(s=>s.corrected).length;
  let sum=0,cnt=0;db.submissions.forEach(s=>{const t=db.tests.find(x=>x.id===s.testId);if(!t)return;const sc=KT.calcScore(s,t);if(sc.total>0){sum+=sc.scored/sc.total*100;cnt++;}});
  const avg=cnt>0?Math.round(sum/cnt):0;
  el.innerHTML=`<div style="background:linear-gradient(135deg,rgba(99,102,241,.15),rgba(139,92,246,.1));border-radius:var(--r2);padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;gap:12px;border:1px solid var(--accent-m)"><span style="font-size:20px">🔐</span><div style="color:rgba(255,255,255,.7);font-size:13px;line-height:1.6"><strong>Admin-Vollzugriff aktiv.</strong> Du siehst alle Tests, Schülerantworten und Musterlösungen.</div></div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px"><div class="stat-card"><div class="stat-val">${db.tests.length}</div><div class="stat-label">Tests</div></div><div class="stat-card"><div class="stat-val" style="color:var(--green)">${db.tests.filter(t=>t.active).length}</div><div class="stat-label">Aktiv</div></div><div class="stat-card"><div class="stat-val">${ts}</div><div class="stat-label">Abgaben</div></div><div class="stat-card"><div class="stat-val">${db.students.length}</div><div class="stat-label">Schüler</div></div><div class="stat-card"><div class="stat-val">${cor}/${ts}</div><div class="stat-label">Korrigiert</div></div><div class="stat-card"><div class="stat-val">${avg}%</div><div class="stat-label">⌀ Score</div></div><div class="stat-card"><div class="stat-val">${db.teachers.length}</div><div class="stat-label">Lehrkräfte</div></div><div class="stat-card"><div class="stat-val">${db.tests.filter(t=>t.ended).length}</div><div class="stat-label">Beendet</div></div></div>
  <div class="panel"><div class="panel-title">⚡ Letzte Aktivität</div>${db.submissions.slice().reverse().slice(0,8).map(s=>{const t=db.tests.find(x=>x.id===s.testId);const sc=KT.calcScore(s,t);return`<div class="stu-row"><div class="stu-avatar">${s.studentName.charAt(0).toUpperCase()}</div><div class="tc-info"><div class="stu-name">${KT.esc(s.studentName)}</div><div style="font-size:11px;color:var(--ink3)">${t?KT.esc(t.title):'–'} · ${new Date(s.submittedAt).toLocaleString('de-DE')}</div></div><span class="badge ${s.corrected?'badge-green':'badge-amber'}">${s.corrected?'✓':'⏳'}</span><span class="badge badge-gray">${sc.scored}/${sc.total}Pt.</span>${s.grade?`<span class="badge badge-purple">Note ${KT.esc(s.grade)}</span>`:''}</div>`;}).join('')||'<div style="color:var(--ink3);font-size:13px">Noch keine Abgaben.</div>'}</div>`;
}

function renderATests(db){document.getElementById('at-atests').innerHTML=`<div class="filter-bar"><input class="filter-inp" type="text" id="at-ts" placeholder="🔍 Test suchen…" oninput="filterATests()" style="min-width:220px"><select class="filter-sel" id="at-tf" onchange="filterATests()"><option value="">Alle</option><option value="active">🟢 Aktiv</option><option value="ended">🔴 Beendet</option><option value="draft">⚪ Entwurf</option></select></div><div id="at-tlist"></div>`;filterATests();}
function filterATests(){
  const db=KT.get();const q=(document.getElementById('at-ts')?.value||'').toLowerCase();const st=document.getElementById('at-tf')?.value||'';
  let tests=db.tests.slice().reverse();if(q)tests=tests.filter(t=>t.title.toLowerCase().includes(q)||(t.teacherName||'').toLowerCase().includes(q));
  if(st==='active')tests=tests.filter(t=>t.active);if(st==='ended')tests=tests.filter(t=>t.ended);if(st==='draft')tests=tests.filter(t=>!t.active&&!t.ended);
  const el=document.getElementById('at-tlist');if(!el)return;
  el.innerHTML=tests.map(t=>{const subs=db.submissions.filter(s=>s.testId===t.id);const qn=(t.pages||[]).reduce((a,p)=>a+(p.blocks||[]).filter(b=>['mc','multi','free'].includes(b.type)).length,0);
  return`<div class="test-card"><div class="tc-icon">📝</div><div class="tc-info"><div class="tc-name">${KT.esc(t.title)}</div><div class="tc-meta">👩‍🏫 ${KT.esc(t.teacherName||'–')} · ${KT.esc(t.subject||'–')} · Klasse ${KT.esc(t.cls||'–')} · ${qn} Fragen · ${subs.length} Abgaben</div><div style="margin-top:4px"><span class="badge ${t.active?'badge-green':t.ended?'badge-red':'badge-gray'}">${t.active?'🟢 Aktiv':t.ended?'🔴 Beendet':'⚪ Entwurf'}</span>${t.joinCode?`<code style="font-family:var(--mono);font-size:11px;background:var(--bg4);padding:2px 8px;border-radius:5px;color:var(--ink3);margin-left:6px">Code: ${t.joinCode}</code>`:''}</div></div><div class="tc-btns"><button class="btn btn-ghost btn-sm" onclick="viewAAnswers('${t.id}')">📊 Antworten</button><button class="del-btn" onclick="deleteATest('${t.id}')">🗑</button></div></div>`;
  }).join('')||'<div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">Kein Test gefunden.</div></div>';
}

function viewAAnswers(id){
  const db=KT.get();const t=db.tests.find(x=>x.id===id);if(!t)return;
  const subs=db.submissions.filter(s=>s.testId===id);const qb=[];(t.pages||[]).forEach(pg=>(pg.blocks||[]).forEach(b=>{if(['mc','multi','free'].includes(b.type))qb.push(b);}));
  // Build Musterlösung section
  let musterHtml=`<div style="background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.3);border-radius:var(--r2);padding:16px;margin-bottom:16px"><div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--accent2);margin-bottom:12px">✅ Musterlösung</div>`;
  qb.forEach((b,i)=>{
    musterHtml+=`<div style="margin-bottom:8px;padding:8px 10px;background:var(--bg3);border-radius:8px;border:1px solid var(--border)"><div style="font-size:11px;font-weight:700;color:var(--ink3);margin-bottom:4px">F${i+1}: ${KT.esc(b.question)}</div>`;
    if(b.type==='mc'){musterHtml+=`<div style="font-size:13px;color:var(--green);font-weight:700">✓ ${KT.esc(b.options[b.correctIndex]||'–')}</div>`;}
    else if(b.type==='multi'){const correct=(b.correctIndexes||[]).map(idx=>KT.esc(b.options[idx]||''));musterHtml+=`<div style="font-size:13px;color:var(--amber);font-weight:700">✓ ${correct.join(', ')||'–'}</div>`;}
    else{musterHtml+=`<div style="font-size:12px;color:var(--ink3);font-style:italic">Freie Antwort – manuell korrigieren</div>`;}
    musterHtml+=`</div>`;
  });
  musterHtml+=`</div>`;
  if(!subs.length){openModal(`<div class="modal-head">📊 ${KT.esc(t.title)}<button class="modal-close" onclick="closeModal()">✕</button></div>${musterHtml}<div style="color:var(--ink3)">Noch keine Abgaben.</div><div style="margin-top:14px;text-align:right"><button class="btn btn-ghost" onclick="closeModal()">Schließen</button></div>`);return;}
  let html=`<div class="modal-head">📊 ${KT.esc(t.title)}<button class="modal-close" onclick="closeModal()">✕</button></div>${musterHtml}`;
  subs.forEach(sub=>{const sc=KT.calcScore(sub,t);const pct=sc.total>0?Math.round(sc.scored/sc.total*100):0;
  html+=`<div style="background:var(--bg3);border-radius:var(--r2);padding:14px;margin-bottom:10px;border:1px solid var(--border)"><div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap"><div class="stu-avatar">${sub.studentName.charAt(0).toUpperCase()}</div><div><div style="font-weight:700;font-size:13px">${KT.esc(sub.studentName)}</div><div style="font-size:11px;color:var(--ink3)">${new Date(sub.submittedAt).toLocaleString('de-DE')} · ${sc.scored}/${sc.total} Pt. (${pct}%)</div></div>${sub.grade?`<span class="badge badge-purple" style="margin-left:auto">Note ${KT.esc(sub.grade)}</span>`:''}<span class="badge ${sub.corrected?'badge-green':'badge-amber'}">${sub.corrected?'✓':'⏳'}</span></div>${qb.map((b,i)=>{const ans=sub.answers?.[b.id];let ad='',cor=false;if(b.type==='mc'){cor=ans===b.correctIndex;ad=ans!=null?KT.esc(b.options[ans]):'';}else if(b.type==='multi'){const ca=JSON.stringify([...(b.correctIndexes||[])].sort((a,c)=>a-c));const ga=JSON.stringify([...(ans||[])].sort((a,c)=>a-c));cor=ca===ga;ad=(ans||[]).map(idx=>KT.esc(b.options[idx])).join(', ')||'–';}else{ad=ans?KT.esc(ans):'–';}return`<div style="margin-bottom:6px"><div style="font-size:11px;font-weight:700;color:var(--ink3);margin-bottom:3px">F${i+1}: ${KT.esc(b.question)}${b.type!=='free'?` <span style="color:${cor?'var(--green)':'var(--red)'}">${cor?'✅':'❌'}</span>`:''}</div><div class="answer-peek">${ad||'–'}</div></div>`;}).join('')}</div>`;});
  html+=`<div style="text-align:right"><button class="btn btn-ghost" onclick="closeModal()">Schließen</button></div>`;
  openModal(html);
}

function deleteATest(id){if(!confirm('Test löschen?'))return;const db=KT.get();db.tests=db.tests.filter(t=>t.id!==id);db.submissions=db.submissions.filter(s=>s.testId!==id);KT.set(db);KT.toast('🗑 Gelöscht.');filterATests();}

function renderAStudents(db){document.getElementById('at-students').innerHTML=`<div class="filter-bar"><input class="filter-inp" type="text" id="at-ss" placeholder="🔍 Schüler suchen…" oninput="filterAStudents()" style="min-width:220px"></div><div id="at-slist"></div>`;filterAStudents();}

function deleteAStudent(name){if(!confirm('Schüler löschen?'))return;const n=decodeURIComponent(name);const db=KT.get();db.students=db.students.filter(s=>s.name!==n);db.submissions=db.submissions.filter(s=>s.studentName!==n);KT.set(db);KT.toast('🗑 Gelöscht.');filterAStudents();}

function renderATeachers(db){document.getElementById('at-teachers').innerHTML=`<div class="panel"><div class="panel-title">Alle Lehrkräfte</div>${db.teachers.map(t=>{const tests=db.tests.filter(x=>x.teacherName===t.name);const subs=db.submissions.filter(s=>tests.find(x=>x.id===s.testId));return`<div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)"><div class="stu-avatar">${t.name.charAt(0).toUpperCase()}</div><div class="tc-info"><div style="font-size:13px;font-weight:700;color:var(--ink)">${KT.esc(t.name)}</div><div style="font-size:11px;color:var(--ink3)">${KT.esc(t.city||'–')} · ${tests.length} Tests · ${subs.length} Abgaben</div></div><button class="del-btn" onclick="deleteATeacher('${encodeURIComponent(t.name)}')">🗑</button></div>`;}).join('')||'<div style="color:var(--ink3)">Noch keine Lehrkräfte.</div>'}</div>`;}
function deleteATeacher(name){if(!confirm('Lehrkraft löschen?'))return;const n=decodeURIComponent(name);const db=KT.get();db.teachers=db.teachers.filter(t=>t.name!==n);KT.set(db);KT.toast('🗑 Gelöscht.');renderATeachers(KT.get());}

function renderAData(db){document.getElementById('at-data').innerHTML=`<div class="panel"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px"><div class="panel-title" style="margin-bottom:0">🗄 Rohdaten</div><div style="display:flex;gap:8px"><button class="btn btn-ghost btn-sm" onclick="exportAll()">📦 Export</button><button class="btn btn-red btn-sm" onclick="resetAll()">⚠️ Reset</button></div></div><div style="font-size:12px;color:var(--ink3);margin-bottom:10px">Tests: ${db.tests.length} · Schüler: ${db.students.length} · Abgaben: ${db.submissions.length} · Lehrkräfte: ${db.teachers.length}</div><textarea style="width:100%;height:360px;font-family:var(--mono);font-size:11px;padding:12px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg3);color:var(--ink2);resize:vertical" readonly>${KT.esc(JSON.stringify(db,null,2))}</textarea><div style="margin-top:12px"><label class="f-label">JSON importieren</label><textarea id="imp-area" style="width:100%;height:100px;font-family:var(--mono);font-size:11px;padding:10px;border:1px solid var(--border2);border-radius:var(--r);resize:vertical;color:var(--ink);background:var(--bg3)" placeholder="JSON hier einfügen…"></textarea><button class="btn btn-amber btn-sm" style="margin-top:8px" onclick="importData()">📥 Importieren</button></div></div>`;}
function exportAll(){KT.dl('fusion-export-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(KT.get(),null,2),'application/json');KT.toast('📦 Export gespeichert.');}
function resetAll(){if(!confirm('ALLES löschen?'))return;if(!confirm('Wirklich?'))return;localStorage.removeItem('fusion_v4');KT.toast('✅ Reset.');renderATab('overview');}
function importData(){const raw=document.getElementById('imp-area')?.value?.trim();if(!raw)return;try{const d=JSON.parse(raw);if(!d.tests||!d.students){alert('Ungültig.');return;}KT.set(d);KT.toast('📥 Importiert!');renderATab('overview');}catch(e){alert('Fehler: '+e.message);}}

let _tutActive=false,_tutId=null,_tutStep=0,_tutSteps=[];
function startTutorial(id){if(_seenTuts.has(id)||_tutActive)return;const tut=TUTS[id];if(!tut)return;_tutActive=true;_tutId=id;_tutStep=0;_tutSteps=tut.steps;const ov=document.getElementById('tut-overlay');ov.classList.add('on');document.getElementById('tut-skip-btn').style.display='block';renderTutStep();}
function renderTutStep(){
  const step=_tutSteps[_tutStep];if(!step){endTutorial();return;}
  const spot=document.getElementById('tut-spot');const bubble=document.getElementById('tut-bubble');bubble.style.display='block';
  bubble.innerHTML=`<div class="tut-step-lbl">Schritt ${_tutStep+1} / ${_tutSteps.length}</div><span class="tut-emoji">${step.e||'💡'}</span><div class="tut-ttl">${step.t}</div><div class="tut-desc">${step.d}</div><div class="tut-nav"><div class="tut-dots">${_tutSteps.map((_,i)=>`<div class="tut-dot${i===_tutStep?' on':''}"></div>`).join('')}</div>${_tutStep>0?`<button class="btn btn-ghost btn-sm" onclick="tutPrev()">←</button>`:''}<button class="btn btn-primary btn-sm" onclick="tutNext()">${_tutStep===_tutSteps.length-1?'✓ Verstanden':'Weiter →'}</button></div>`;
  if(step.target&&!step.noTarget){const el=document.querySelector(step.target);if(el){spot.style.display='block';const r=el.getBoundingClientRect();spot.style.left=(r.left-6)+'px';spot.style.top=(r.top-6)+'px';spot.style.width=(r.width+12)+'px';spot.style.height=(r.height+12)+'px';let bTop=r.bottom+16,bLeft=r.left;if(bTop+270>window.innerHeight)bTop=r.top-280;if(bLeft+320>window.innerWidth)bLeft=window.innerWidth-330;bubble.style.left=Math.max(10,bLeft)+'px';bubble.style.top=Math.max(10,bTop)+'px';bubble.style.transform='';el.scrollIntoView({behavior:'smooth',block:'nearest'});}else{spot.style.display='none';centerBubble();}}else{spot.style.display='none';centerBubble();}
}
function centerBubble(){const b=document.getElementById('tut-bubble');b.style.left='50%';b.style.top='50%';b.style.transform='translate(-50%,-50%)';}
function tutNext(){_tutStep++;if(_tutStep>=_tutSteps.length)endTutorial();else{document.getElementById('tut-bubble').style.transform='';renderTutStep();}}
function tutPrev(){_tutStep=Math.max(0,_tutStep-1);document.getElementById('tut-bubble').style.transform='';renderTutStep();}
function endTutorial(){_tutActive=false;_seenTuts.add(_tutId);localStorage.setItem('fusion_seen_tuts',JSON.stringify([..._seenTuts]));document.getElementById('tut-overlay').classList.remove('on');document.getElementById('tut-spot').style.display='none';document.getElementById('tut-bubble').style.display='none';document.getElementById('tut-skip-btn').style.display='none';KT.toast('✓ Tutorial gespeichert!');}

init();
</script>
</body>
