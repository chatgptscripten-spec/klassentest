<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fusion – Lehreransicht</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,700;9..144,800;9..144,900&display=swap" rel="stylesheet">
<style>
:root{
  --font:'DM Sans',system-ui,sans-serif;
  --display:'Fraunces',Georgia,serif;
  --mono:'DM Mono',monospace;
  --ink:#111827;--ink2:#374151;--ink3:#6b7280;--ink4:#9ca3af;
  --paper:#ffffff;--paper2:#f9fafb;--paper3:#f3f4f6;
  --accent:#4f46e5;--accent-l:#eef2ff;--accent-m:#c7d2fe;--accent-d:#3730a3;
  --green:#059669;--green-l:#ecfdf5;--green-m:#a7f3d0;
  --amber:#d97706;--amber-l:#fffbeb;--amber-m:#fde68a;
  --red:#dc2626;--red-l:#fef2f2;--red-m:#fecaca;
  --border:#e5e7eb;--border2:#d1d5db;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow2:0 4px 16px rgba(0,0,0,.08);
  --shadow3:0 8px 32px rgba(0,0,0,.1);
  --r:10px;--r2:12px;--r3:16px;--r4:20px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--paper2);color:var(--ink);min-height:100vh;font-size:14px;line-height:1.5}
@keyframes scaleIn{from{opacity:0;transform:scale(.96) translateY(4px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(79,70,229,.15)}50%{box-shadow:0 0 0 8px rgba(79,70,229,.04)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* APP LAYOUT */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:240px;background:var(--paper);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* SIDEBAR */
.sb-head{padding:18px 16px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sb-logo{width:38px;height:38px;background:linear-gradient(135deg,#6366f1,#4f46e5);border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 12px rgba(79,70,229,.3)}
.sb-logo-text{font-family:var(--display);font-size:14px;font-weight:900;color:var(--ink);letter-spacing:-.3px}
.sb-logo-sub{font-size:10px;color:var(--ink3);margin-top:1px}
.sb-nav{flex:1;overflow-y:auto;padding:10px 8px}
.nb{width:100%;padding:9px 12px;border-radius:var(--r);border:none;background:transparent;color:var(--ink3);font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:9px;transition:all .14s;text-align:left}
.nb:hover{background:var(--paper3);color:var(--ink2)}
.nb.active{background:var(--accent-l);color:var(--accent);border:1px solid var(--accent-m)}
.nb-sep{height:1px;background:var(--border);margin:6px 0}
.nb-label{font-size:9px;font-weight:800;letter-spacing:1.2px;color:var(--ink4);text-transform:uppercase;padding:6px 12px 3px}
.sb-footer{padding:12px 14px;border-top:1px solid var(--border)}
.sb-user{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sb-av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#818cf8);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;flex-shrink:0}
.sb-uname{font-size:12px;font-weight:700;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-urole{font-size:10px;color:var(--ink4);margin-top:1px}
.btn-logout{width:100%;padding:7px;border-radius:8px;border:1px solid var(--border2);background:transparent;color:var(--ink3);font-family:var(--font);font-size:11px;font-weight:600;cursor:pointer;transition:all .14s}
.btn-logout:hover{background:var(--red-l);border-color:var(--red-m);color:var(--red)}

/* TOPBAR */
.topbar{padding:0 24px;height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border);background:var(--paper)}
.topbar-title{font-family:var(--display);font-size:17px;font-weight:800;letter-spacing:-.3px;color:var(--ink)}
.topbar-actions{display:flex;gap:6px;align-items:center}

/* SECTIONS */
.section{display:none;flex:1;flex-direction:column;overflow:hidden}
.section.active{display:flex}
.page{flex:1;overflow-y:auto;padding:22px 24px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:9px;border:1.5px solid transparent;font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-d);box-shadow:0 2px 10px rgba(79,70,229,.3)}
.btn-green{background:var(--green);color:#fff;border-color:var(--green)}
.btn-green:hover{filter:brightness(1.05)}
.btn-red{background:var(--red);color:#fff;border-color:var(--red)}
.btn-ghost{background:var(--paper);color:var(--ink2);border-color:var(--border2)}
.btn-ghost:hover{border-color:var(--accent-m);color:var(--accent);background:var(--accent-l)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}
.btn-lg{padding:12px 22px;font-size:15px;border-radius:var(--r2)}
.btn-full{width:100%;justify-content:center}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* PANELS */
.panel{background:var(--paper);border:1px solid var(--border);border-radius:var(--r2);padding:18px 20px;margin-bottom:14px}
.panel-title{font-size:10px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:14px;display:flex;align-items:center;gap:7px}

/* CARDS */
.test-card{background:var(--paper);border:1px solid var(--border);border-radius:var(--r2);padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:8px;transition:all .14s}
.test-card:hover{border-color:var(--border2);background:var(--paper3)}
.tc-icon{font-size:22px;flex-shrink:0}
.tc-info{flex:1;min-width:0}
.tc-name{font-size:14px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-meta{font-size:11px;color:var(--ink3);margin-top:2px}
.tc-btns{display:flex;gap:5px;flex-wrap:wrap;flex-shrink:0}

/* FIELDS */
.field{margin-bottom:14px}
.f-label{display:block;font-size:10px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
.f-inp{width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:var(--r);font-family:var(--font);font-size:13px;color:var(--ink);background:var(--paper);transition:border .15s}
.f-inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.08)}
.f-sel{width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:var(--r);font-family:var(--font);font-size:13px;color:var(--ink);background:var(--paper)}
.f-ta{width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:var(--r);font-family:var(--font);font-size:13px;color:var(--ink);background:var(--paper);resize:vertical;line-height:1.6}
.f-ta:focus{outline:none;border-color:var(--accent)}

/* ALERTS */
.alert{padding:11px 14px;border-radius:var(--r);font-size:13px;line-height:1.6}
.alert-blue{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}
.alert-green{background:var(--green-l);color:#065f46;border:1px solid var(--green-m)}
.alert-red{background:var(--red-l);color:var(--red);border:1px solid var(--red-m)}
.alert-amber{background:var(--amber-l);color:#92400e;border:1px solid var(--amber-m)}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);align-items:center;justify-content:center;padding:1rem}
.modal-bg.open{display:flex}
.modal{background:var(--paper);border:1px solid var(--border2);border-radius:var(--r4);max-width:580px;width:100%;max-height:90vh;overflow-y:auto;padding:28px;box-shadow:var(--shadow3);animation:scaleIn .2s cubic-bezier(.16,1,.3,1)}
.modal-head{font-family:var(--display);font-size:18px;font-weight:800;color:var(--ink);margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.modal-close{background:var(--paper3);border:1px solid var(--border);border-radius:7px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;color:var(--ink3)}
.modal-close:hover{background:var(--red-l);color:var(--red)}

/* LOGIN */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;background:var(--paper2);background-image:radial-gradient(ellipse 70% 60% at 20% 10%,rgba(79,70,229,.07) 0%,transparent 60%),radial-gradient(ellipse 50% 40% at 85% 85%,rgba(16,185,129,.05) 0%,transparent 50%)}
.login-card{background:var(--paper);border:1px solid var(--border);border-radius:var(--r4);padding:2.5rem;width:100%;max-width:440px;box-shadow:var(--shadow3);animation:scaleIn .35s cubic-bezier(.16,1,.3,1)}
.login-logo{text-align:center;margin-bottom:2rem}
.login-logo-mark{width:64px;height:64px;background:linear-gradient(135deg,#6366f1,#4f46e5);border-radius:20px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:28px;font-weight:900;color:#fff;margin:0 auto 16px;box-shadow:0 6px 24px rgba(79,70,229,.35),0 0 0 6px rgba(79,70,229,.08)}
.login-title{font-family:var(--display);font-size:26px;font-weight:900;letter-spacing:-.5px;margin-bottom:6px}
.login-sub{font-size:13px;color:var(--ink3);line-height:1.7}

/* BADGE */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.2px}
.badge-green{background:var(--green-l);color:#065f46;border:1px solid var(--green-m)}
.badge-amber{background:var(--amber-l);color:#92400e;border:1px solid var(--amber-m)}
.badge-red{background:var(--red-l);color:var(--red);border:1px solid var(--red-m)}
.badge-blue{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}
.badge-gray{background:var(--paper3);color:var(--ink3);border:1px solid var(--border)}
.badge-purple{background:var(--accent-l);color:var(--accent);border:1px solid var(--accent-m)}

/* STU ROW */
.stu-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.stu-row:last-child{border-bottom:none}
.stu-av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#818cf8);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex-shrink:0}
.stu-name{flex:1;font-size:13px;font-weight:600;color:var(--ink2)}

/* LIVE */
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-m);animation:pulse 2s infinite;flex-shrink:0}
.timer-chip{background:var(--ink);color:#fff;border-radius:22px;padding:7px 16px;font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:2px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.timer-chip.warn{background:#92400e}
.timer-chip.danger{background:var(--red);animation:blink .8s infinite}

/* EMPTY */
.empty{text-align:center;padding:60px 20px;color:var(--ink3)}
.empty-icon{font-size:48px;margin-bottom:14px;opacity:.4}
.empty-text{font-size:14px;line-height:1.8}

/* CORR */
.corr-item{background:var(--paper3);border:1px solid var(--border);border-radius:var(--r2);padding:14px 18px;margin-bottom:8px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .14s}
.corr-item:hover{border-color:var(--accent-m);background:var(--accent-l)}
.ans-row{padding:7px 10px;border-radius:8px;font-size:13px;margin-bottom:4px;border:1px solid transparent}
.ans-ok{background:var(--green-l);border-color:var(--green-m);color:#065f46}
.ans-wrong{background:var(--red-l);border-color:var(--red-m);color:var(--red)}
.ans-neutral{background:var(--paper3);color:var(--ink3)}

/* PROGRESS */
.progress-bar{height:4px;background:var(--paper3);border-radius:99px;overflow:hidden;margin-top:6px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),#818cf8);border-radius:99px;transition:width .4s}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--paper);flex-shrink:0}
.tab{padding:12px 18px;font-size:12px;font-weight:700;color:var(--ink3);border:none;background:transparent;cursor:pointer;border-bottom:2px solid transparent;transition:all .14s;display:flex;align-items:center;gap:6px;white-space:nowrap;font-family:var(--font)}
.tab:hover{color:var(--ink2);background:var(--paper3)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-content{display:none;flex:1;overflow-y:auto;padding:22px 24px}
.tab-content.active{display:block}

/* SIG PAD */
.sig-wrap{border:1.5px solid var(--border2);border-radius:var(--r2);overflow:hidden;background:#fff;touch-action:none}
.sig-canvas{display:block;width:100%;cursor:crosshair;touch-action:none}
.sig-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--paper3);border-top:1px solid var(--border)}
.sig-color{width:18px;height:18px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:all .13s}
.sig-color.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(79,70,229,.2)}
.sig-size{padding:3px 8px;border-radius:6px;border:1px solid var(--border2);background:var(--paper);color:var(--ink3);font-size:11px;font-weight:700;cursor:pointer;font-family:var(--font)}
.sig-size.active{background:var(--accent-l);border-color:var(--accent-m);color:var(--accent)}

/* GRID */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:900px){.g2{grid-template-columns:1fr}}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:99px;font-size:13px;font-weight:600;z-index:9999;animation:scaleIn .2s cubic-bezier(.16,1,.3,1);pointer-events:none;white-space:nowrap}

/* CODE PILL */
.code-pill{display:inline-block;background:var(--paper3);color:var(--ink);font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:8px;padding:12px 24px;border-radius:var(--r2);border:1px solid var(--border2)}

/* ANSWER preview */
.answer-peek{background:var(--paper3);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;color:var(--ink2);white-space:pre-wrap;margin-bottom:4px}
</style>
</head>
<body>
<div id="app">
  <div class="login-screen" id="login-screen">
    <div class="login-card">
      <div class="login-logo">
        <div class="login-logo-mark">F</div>
        <div class="login-title">Fusion</div>
        <div class="login-sub">Lehreransicht — Bitte anmelden</div>
      </div>
      <div class="field">
        <label class="f-label">Vollständiger Name</label>
        <input class="f-inp" type="text" id="l-name" placeholder="z.B. Dr. Maria Schmidt" autocomplete="off" autofocus>
      </div>
      <div class="field">
        <label class="f-label">Schule / Standort</label>
        <input class="f-inp" type="text" id="l-city" placeholder="z.B. Gymnasium Lüdenscheid">
      </div>
      <div class="field">
        <label class="f-label">Passwort</label>
        <input class="f-inp" type="password" id="l-pass" placeholder="">
      </div>
      <div class="field">
        <label class="f-label">Passwort bestätigen <span style="color:var(--ink4)">(nur bei Erstanmeldung)</span></label>
        <input class="f-inp" type="password" id="l-pass2" placeholder="">
      </div>
      <div id="l-err" class="alert alert-red" style="display:none;margin-bottom:14px"></div>
      <button class="btn btn-primary btn-full btn-lg" onclick="doLogin()">Anmelden →</button>
    </div>
  </div>

  <div class="app" id="main-app" style="display:none">
    <aside class="sidebar">
      <div class="sb-head">
        <div class="sb-logo"><span style="font-family:var(--display);font-size:18px;font-weight:900;color:#fff">F</span></div>
        <div>
          <div class="sb-logo-text">Fusion</div>
          <div class="sb-logo-sub" id="sb-sub">Lehreransicht</div>
        </div>
      </div>
      <nav class="sb-nav">
        <div class="nb-label">Hauptmenü</div>
        <button class="nb active" onclick="navTo('tests')" id="nb-tests">📋 Meine Tests</button>
        <button class="nb" onclick="navTo('create')" id="nb-create">✦ Test erstellen</button>
        <div class="nb-sep"></div>
        <div class="nb-label">Verwaltung</div>
        <button class="nb" onclick="navTo('live')" id="nb-live">🟢 Live-Modus</button>
        <button class="nb" onclick="navTo('subs')" id="nb-subs">📨 Abgaben</button>
        <button class="nb" onclick="navTo('correct')" id="nb-correct">✏️ Korrigieren</button>
        <div id="nb-admin-wrap" style="display:none">
          <div class="nb-sep"></div>
          <button class="nb" onclick="navTo('admin')" id="nb-admin">🔐 Admin</button>
        </div>
      </nav>
      <div class="sb-footer">
        <div class="sb-user">
          <div class="sb-av" id="sb-av">?</div>
          <div>
            <div class="sb-uname" id="sb-name">–</div>
            <div class="sb-urole" id="sb-role">Lehrkraft</div>
          </div>
        </div>
        <button class="btn-logout" onclick="doLogout()">← Abmelden</button>
      </div>
    </aside>

    <div class="main">
      <!-- TESTS -->
      <div class="section active" id="s-tests">
        <div class="topbar">
          <div class="topbar-title">📋 Meine Tests</div>
          <div class="topbar-actions">
            <button class="btn btn-primary btn-sm" onclick="navTo('create')">✦ Neuer Test</button>
          </div>
        </div>
        <div class="page"><div id="tests-list"></div></div>
      </div>

      <!-- CREATE -->
      <div class="section" id="s-create">
        <div class="topbar">
          <div class="topbar-title" id="create-heading">✦ Test erstellen</div>
          <div class="topbar-actions">
            <button class="btn btn-ghost btn-sm" onclick="saveDraft()">💾 Entwurf</button>
            <button class="btn btn-primary btn-sm" onclick="goStartSetup()">▶ Starten</button>
          </div>
        </div>
        <div class="page" style="max-width:700px"><div id="create-form"></div></div>
      </div>

      <!-- LIVE -->
      <div class="section" id="s-live">
        <div id="live-container" style="display:flex;flex-direction:column;flex:1;overflow:hidden"></div>
      </div>

      <!-- SUBS -->
      <div class="section" id="s-subs">
        <div class="topbar"><div class="topbar-title">📨 Abgaben</div></div>
        <div class="page"><div id="subs-list"></div></div>
      </div>

      <!-- CORRECT -->
      <div class="section" id="s-correct">
        <div class="topbar"><div class="topbar-title">✏️ Korrigieren</div></div>
        <div class="page"><div id="correct-list"></div></div>
      </div>

      <!-- ADMIN -->
      <div class="section" id="s-admin">
        <div class="topbar">
          <div class="topbar-title">🔐 Administration</div>
          <div class="topbar-actions">
            <button class="btn btn-ghost btn-sm" onclick="exportAll()">📦 Export</button>
            <button class="btn btn-sm" style="background:var(--red-l);color:var(--red);border:1px solid var(--red-m)" onclick="resetAll()">⚠️ Reset</button>
          </div>
        </div>
        <div class="tabs">
          <button class="tab active" onclick="switchAdminTab('overview')">📊 Übersicht</button>
          <button class="tab" onclick="switchAdminTab('tests')">📝 Alle Tests</button>
          <button class="tab" onclick="switchAdminTab('students')">🎒 Schüler</button>
          <button class="tab" onclick="switchAdminTab('teachers')">👩‍🏫 Lehrkräfte</button>
        </div>
        <div style="flex:1;overflow:hidden;display:flex;flex-direction:column">
          <div class="tab-content active" id="at-overview"></div>
          <div class="tab-content" id="at-tests"></div>
          <div class="tab-content" id="at-students"></div>
          <div class="tab-content" id="at-teachers"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-body"></div>
</div>

<script>
// ─────────── STORAGE ───────────
const STORE_KEY = 'fusion_v5';
let _db = null;

function getDB() {
  if (_db) return _db;
  try {
    const raw = localStorage.getItem(STORE_KEY);
    _db = raw ? JSON.parse(raw) : defaultDB();
  } catch(e) { _db = defaultDB(); }
  return _db;
}

function saveDB() {
  localStorage.setItem(STORE_KEY, JSON.stringify(_db));
}

function defaultDB() {
  return {
    teachers: [],
    tests: [],
    students: [],
    submissions: []
  };
}

let _teacher = null;
let _isAdmin = false;
let _editId = null;
let _timerInt = null;
let _timerSecs = 0;
let _pollInt = null;
let _sigCtx = null;
let _sigDrawing = false;

let _sigSize = 2;

// ─────────── UTILS ───────────
function esc(str) {
  if (str == null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function gid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

function genCode() {
  return Math.random().toString(36).slice(2,8).toUpperCase();
}

function fmt(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2800);
}

function calcScore(sub, test) {
  let scored = 0, total = 0;
  const qBlocks = (test?.pages || []).flatMap(pg => (pg.blocks || []).filter(b => ['mc','multi','free'].includes(b.type)));
  qBlocks.forEach(b => {
    const pts = b.points || 1;
    total += pts;
    const ans = sub?.answers?.[b.id];
    if (b.type === 'mc' && ans === b.correctIndex) scored += pts;
    else if (b.type === 'multi') {
      const sorted = a => [...(a||[])].sort().join(',');
      if (sorted(ans) === sorted(b.correctIndexes)) scored += pts;
    } else if (b.type === 'free') {
      const mp = sub?.manualScores?.[b.id];
      if (mp != null) scored += Math.min(pts, mp);
    }
  });
  return { scored, total };
}

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
}

const ADMIN_MAGIC = 'fusion-admin-v5';
async function checkAdmin(name, city, pass) {
  const key = await sha256(name + city + pass + ADMIN_MAGIC);
  return key.startsWith('00') || pass === 'fusion-admin-2025';
}

// ─────────── LOGIN ───────────
function init() {
  const saved = localStorage.getItem('fusion_teacher');
  if (saved) {
    try {
      _teacher = JSON.parse(saved);
      _isAdmin = _teacher.isAdmin || false;
      applyTeacher();
      showApp();
      navTo('tests');
      return;
    } catch(e) {}
  }
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('main-app').style.display = 'none';
  document.getElementById('l-name').focus();
  document.getElementById('l-pass').addEventListener('keydown', e => { if (e.key==='Enter') document.getElementById('l-pass2').focus(); });
  document.getElementById('l-pass2').addEventListener('keydown', e => { if (e.key==='Enter') doLogin(); });
}

async function doLogin() {
  const name = document.getElementById('l-name').value.trim();
  const city = document.getElementById('l-city').value.trim();
  const pass = document.getElementById('l-pass').value;
  const pass2 = document.getElementById('l-pass2').value;
  const err = document.getElementById('l-err');
  err.style.display = 'none';

  if (!name) { err.textContent = '❌ Bitte Namen eingeben.'; err.style.display = 'block'; return; }
  if (!city) { err.textContent = '❌ Bitte Schule/Standort eingeben.'; err.style.display = 'block'; return; }
  if (!pass) { err.textContent = '❌ Bitte Passwort eingeben.'; err.style.display = 'block'; return; }

  const db = getDB();
  const existing = db.teachers.find(t => t.name.toLowerCase() === name.toLowerCase() && (t.city||'').toLowerCase() === city.toLowerCase());

  if (existing) {
    if (existing.passHash) {
      const ph = await sha256(pass);
      if (ph !== existing.passHash) { err.textContent = '❌ Falsches Passwort.'; err.style.display = 'block'; return; }
    }
    existing.lastSeen = Date.now();
    saveDB();
    _teacher = { name: existing.name, city, isAdmin: existing.isAdmin || false };
    _isAdmin = _teacher.isAdmin;
  } else {
    if (pass.length < 4) { err.textContent = '❌ Passwort mind. 4 Zeichen.'; err.style.display = 'block'; return; }
    if (pass !== pass2) { err.textContent = '❌ Passwörter stimmen nicht überein.'; err.style.display = 'block'; return; }
    const admin = await checkAdmin(name, city, pass);
    const passHash = await sha256(pass);
    const tRecord = { name, city, passHash, isAdmin: admin, lastSeen: Date.now(), createdAt: Date.now() };
    db.teachers.push(tRecord);
    saveDB();
    _teacher = { name, city, isAdmin: admin };
    _isAdmin = admin;
  }

  localStorage.setItem('fusion_teacher', JSON.stringify(_teacher));
  applyTeacher();
  showApp();
  navTo('tests');
}

function applyTeacher() {
  const n = _teacher.name;
  document.getElementById('sb-name').textContent = n;
  document.getElementById('sb-av').textContent = n.charAt(0).toUpperCase();
  document.getElementById('sb-role').textContent = _teacher.city || 'Lehrkraft';
  if (_isAdmin) {
    document.getElementById('sb-sub').textContent = '🔐 Admin';
    document.getElementById('nb-admin-wrap').style.display = 'block';
  }
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('main-app').style.display = 'flex';
}

function doLogout() {
  localStorage.removeItem('fusion_teacher');
  clearInterval(_timerInt);
  clearInterval(_pollInt);
  _teacher = null;
  _isAdmin = false;
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('main-app').style.display = 'none';
  document.getElementById('l-pass').value = '';
  document.getElementById('l-pass2').value = '';
  document.getElementById('l-err').style.display = 'none';
}

function navTo(id) {

}

function renderSection(id) {

function renderQList(qs) {
  if (!qs.length) return '<div style="color:var(--ink4);font-size:13px;padding:8px 0">Noch keine Fragen. Füge oben eine Frage hinzu.</div>';
  return qs.map((q, i) => `<div style="background:var(--paper3);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:8px">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">

      <input type="number" value="${q.points||1}" min="1" max="99" style="width:55px;padding:7px 8px;border:1px solid var(--border2);border-radius:8px;font-family:var(--font);font-size:13px;background:var(--paper);color:var(--ink);text-align:center" oninput="updateQ(${i},'points',+this.value)" title="Punkte">

      ${i < getCurrentQs().length-1 ? `<button onclick="moveQ(${i},1)" style="background:none;border:none;cursor:pointer;color:var(--ink3);font-size:14px">↓</button>` : ''}
      <button onclick="delQ(${i})" style="background:none;border:none;cursor:pointer;color:var(--red);font-size:13px">✕</button>
    </div>
    ${q.type==='mc'?renderMCEdit(q,i):q.type==='multi'?renderMultiEdit(q,i):`<input type="text" value="${esc(q.modelAnswer||'')}" placeholder="Musterlösung (optional, nur für Lehrkraft)…" style="width:100%;padding:7px 10px;border:1px solid var(--border2);border-radius:8px;font-family:var(--font);font-size:13px;background:var(--paper);color:var(--ink)" oninput="updateQ(${i},'modelAnswer',this.value)"><div style="font-size:11px;color:var(--ink4);margin-top:4px">Anzahl Zeilen für Schüler: <input type="number" value="${q.lines||4}" min="1" max="20" style="width:50px;padding:3px 6px;border:1px solid var(--border2);border-radius:5px;font-family:var(--font);font-size:11px;background:var(--paper);color:var(--ink)" oninput="updateQ(${i},'lines',+this.value)"></div>`}
  </div>`).join('');

function renderMCEdit(q, i) {
  return (q.options||['','','','']).map((o, oi) => `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
    <div onclick="updateQ(${i},'correctIndex',${oi})" style="width:20px;height:20px;border-radius:50%;border:2px solid ${oi===q.correctIndex?'var(--green)':'var(--border2)'};background:${oi===q.correctIndex?'var(--green)':'transparent'};cursor:pointer;flex-shrink:0;transition:all .14s"></div>
    <input type="text" value="${esc(o)}" placeholder="Antwort ${oi+1}…" style="flex:1;padding:7px 10px;border:1px solid var(--border2);border-radius:8px;font-family:var(--font);font-size:13px;background:var(--paper);color:var(--ink)" oninput="updateQOpt(${i},${oi},this.value)">
    ${(q.options||[]).length>2?`<button onclick="delOpt(${i},${oi})" style="background:none;border:none;cursor:pointer;color:var(--red);font-size:12px">✕</button>`:''}
  </div>`).join('') + `<button onclick="addOpt(${i})" style="padding:4px 10px;border:1px dashed var(--border2);border-radius:7px;background:none;color:var(--ink3);font-family:var(--font);font-size:12px;cursor:pointer;margin-top:4px">+ Option</button>`;
}

function renderMultiEdit(q, i) {
  return (q.options||['','','','']).map((o, oi) => `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
    <div onclick="toggleMultiCorrect(${i},${oi})" style="width:20px;height:20px;border-radius:5px;border:2px solid ${(q.correctIndexes||[]).includes(oi)?'var(--amber)':'var(--border2)'};background:${(q.correctIndexes||[]).includes(oi)?'var(--amber)':'transparent'};cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800;transition:all .14s">${(q.correctIndexes||[]).includes(oi)?'✓':''}</div>
    <input type="text" value="${esc(o)}" placeholder="Antwort ${oi+1}…" style="flex:1;padding:7px 10px;border:1px solid var(--border2);border-radius:8px;font-family:var(--font);font-size:13px;background:var(--paper);color:var(--ink)" oninput="updateQOpt(${i},${oi},this.value)">
    ${(q.options||[]).length>2?`<button onclick="delOpt(${i},${oi})" style="background:none;border:none;cursor:pointer;color:var(--red);font-size:12px">✕</button>`:''}
  </div>`).join('') + `<button onclick="addOpt(${i})" style="padding:4px 10px;border:1px dashed var(--border2);border-radius:7px;background:none;color:var(--ink3);font-family:var(--font);font-size:12px;cursor:pointer;margin-top:4px">+ Option</button>`;
}

function getCurrentQs() {
  const db = getDB();
  const t = _editId ? db.tests.find(x => x.id === _editId) : null;
  return t?.questions || [];
}

function addQ(type) {
  const db = getDB();
  let t = _editId ? db.tests.find(x => x.id === _editId) : null;
  if (!t) {
    const title = document.getElementById('c-title')?.value.trim() || 'Neuer Test';
    t = { id: gid(), title, subject: '', cls: '', questions: [], teacherName: _teacher.name, joinCode: genCode(), active: false, ended: false, createdAt: Date.now(), timerSeconds: 1800 };
    db.tests.push(t);
    _editId = t.id;
    saveDB();
  }
  const q = { id: gid(), type, question: '', points: 1 };
  if (type === 'mc') q.options = ['','','',''];  q.correctIndex = 0;
  if (type === 'multi') { q.options = ['','','','']; q.correctIndexes = []; }
  if (type === 'free') { q.lines = 4; q.modelAnswer = ''; }
  t.questions = t.questions || [];
  t.questions.push(q);
  saveDB();
  refreshQList();
}

function updateQ(i, key, val) {
  const db = getDB();
  const t = _editId ? db.tests.find(x => x.id === _editId) : null;
  if (!t?.questions?.[i]) return;
  t.questions[i][key] = val;
  saveDB();
  if (key === 'correctIndex') refreshQList();
}

function updateQOpt(qi, oi, val) {
  const db = getDB();
  const t = _editId ? db.tests.find(x => x.id === _editId) : null;
  if (!t?.questions?.[qi]) return;
  if (!t.questions[qi].options) t.questions[qi].options = [];
  t.questions[qi].options[oi] = val;
  saveDB();
}

function toggleMultiCorrect(qi, oi) {
  const db = getDB();
  const t = _editId ? db.tests.find(x => x.id === _editId) : null;
  if (!t?.questions?.[qi]) return;
  const ci = t.questions[qi].correctIndexes || [];
  const idx = ci.indexOf(oi);
  if (idx >= 0) ci.splice(idx, 1); else ci.push(oi);
  t.questions[qi].correctIndexes = ci;
  saveDB();
  refreshQList();
}

function addOpt(qi) {
  const db = getDB();
  const t = _editId ? db.tests.find(x => x.id === _editId) : null;
  if (!t?.questions?.[qi]) return;
  t.questions[qi].options = t.questions[qi].options || [];
  t.questions[qi].options.push('');
  saveDB();
  refreshQList();
}

function delOpt(qi, oi) {
  const db = getDB();
  const t = _editId ? db.tests.find(x => x.id === _editId) : null;
  if (!t?.questions?.[qi]) return;
  t.questions[qi].options.splice(oi, 1);
  saveDB();
  refreshQList();
}

function delQ(i) {
  const db = getDB();
  const t = _editId ? db.tests.find(x => x.id === _editId) : null;
  if (!t) return;
  t.questions.splice(i, 1);
  saveDB();
  refreshQList();
}

function moveQ(i, dir) {
  const db = getDB();
  const t = _editId ? db.tests.find(x => x.id === _editId) : null;
  if (!t) return;
  const q = t.questions.splice(i, 1)[0];
  t.questions.splice(i + dir, 0, q);
  saveDB();
  refreshQList();
}

function refreshQList() {
  const db = getDB();
  const t = _editId ? db.tests.find(x => x.id === _editId) : null;
  const el = document.getElementById('q-list');
  if (el) el.innerHTML = renderQList(t?.questions || []);
}

function saveDraft() {
  const db = getDB();
  const title = document.getElementById('c-title')?.value.trim();
  const subj = document.getElementById('c-subj')?.value;
  const cls = document.getElementById('c-cls')?.value;
  if (!_editId) {

function goStartSetup() {

    if (!title) { showCreateErr('Bitte Titel eingeben.'); return; }

    _editId = t.id;

    if (title) t.title = title;

  showCodeSetup(t.id);

function showCodeSetup(testId) {

    <div class="field"><label class="f-label">Dauer (Minuten)</label><input type="number" id="setup-mins" value="30" min="1" max="300" class="f-inp" style="font-size:26px;font-weight:700;text-align:center;font-family:var(--mono)"></div>
    <div style="text-align:center;margin:1.5rem 0">
      <div class="f-label" style="margin-bottom:12px;text-align:center">Zugangscode für Schüler</div>
      <div class="code-pill" id="code-display">${t.joinCode}</div>
      <div style="margin-top:10px"><button class="btn btn-ghost btn-sm" onclick="regenCode('${testId}')">🔄 Neu</button></div>
    </div>
    <div class="alert alert-blue" style="margin-bottom:1.25rem">Schüler öffnen den Schüler-Link und geben diesen Code ein.</div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-ghost" onclick="closeModal()">Abbrechen</button>
      <button class="btn btn-green btn-lg" onclick="activateTest('${testId}')">🟢 Starten</button>
    </div>`);
}

function regenCode(testId) {
  const db = getDB();
  const t = db.tests.find(x => x.id === testId);
  if (!t) return;
  t.joinCode = genCode();
  saveDB();
  const el = document.getElementById('code-display');
  if (el) el.textContent = t.joinCode;
}

function activateTest(testId) {
  const mins = parseInt(document.getElementById('setup-mins')?.value) || 30;
  const db = getDB();
  const t = db.tests.find(x => x.id === testId);
  if (!t) return;
  t.active = true; t.ended = false;
  t.timerSeconds = mins * 60;
  t.startedAt = Date.now();
  saveDB();
  _timerSecs = mins * 60;
  closeModal();
  clearInterval(_timerInt);
  _timerInt = setInterval(() => {
    _timerSecs = Math.max(0, _timerSecs - 1);
    const el = document.getElementById('timer-chip');
    if (el) { el.textContent = '⏱ ' + fmt(_timerSecs); el.className = 'timer-chip' + (_timerSecs < 300 ? ' warn' : '') + (_timerSecs < 60 ? ' danger' : ''); }
    if (_timerSecs === 0) { clearInterval(_timerInt); endTestAuto(testId); }
  }, 1000);
  navTo('live');
  toast('🟢 Test gestartet!');
}

// ─────────── LIVE ───────────
function renderLive(mine, db) {
  const active = mine.find(t => t.active);
  const el = document.getElementById('live-container');
  if (!active) {
    el.innerHTML = `<div class="topbar"><div class="topbar-title">💤 Live-Modus</div></div><div class="page"><div class="empty"><div class="empty-icon">💤</div><div class="empty-text">Kein Test aktiv.</div></div></div>`;
    return;
  }
  const subs = db.submissions.filter(s => s.testId === active.id && s.submitted);
  const joined = db.students.filter(s => s.currentTestId === active.id);
  const pct = joined.length ? Math.round(subs.length / joined.length * 100) : 0;

  el.innerHTML = `
    <div class="topbar">
      <div class="topbar-title" style="display:flex;align-items:center;gap:10px"><div class="live-dot"></div>${esc(active.title)}</div>
      <div class="topbar-actions">
        <div class="timer-chip" id="timer-chip">⏱ ${fmt(_timerSecs)}</div>
        <button class="btn btn-ghost btn-sm" onclick="addTimeLive(5)">+5 Min</button>
        <button class="btn btn-ghost btn-sm" onclick="addTimeLive(-5)">−5 Min</button>
        <button class="btn btn-red btn-sm" onclick="endTest('${active.id}')">⏹ Beenden</button>
      </div>
    </div>
    <div class="page">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:24px;background:var(--paper);border:1px solid var(--border);border-radius:var(--r2);padding:20px 24px;margin-bottom:16px;flex-wrap:wrap">
        <div style="display:flex;gap:28px;flex-wrap:wrap">
          <div><div style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--ink4)">Verbunden</div><div style="font-size:32px;font-weight:800;color:var(--ink)" id="live-join">${joined.length}</div></div>
          <div><div style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--ink4)">Abgaben</div><div style="font-size:32px;font-weight:800;color:var(--green)" id="live-subs">${subs.length}</div></div>
          <div><div style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--ink4)">Offen</div><div style="font-size:32px;font-weight:800;color:var(--amber)" id="live-open">${Math.max(0,joined.length-subs.length)}</div></div>
        </div>
        <div style="min-width:180px">
          <div style="font-size:11px;font-weight:700;color:var(--ink3);margin-bottom:6px" id="live-pct-lbl">Fortschritt ${pct}%</div>
          <div class="progress-bar" style="width:180px"><div class="progress-fill" id="live-pct" style="width:${pct}%"></div></div>
        </div>
        <div style="text-align:center">
          <div class="code-pill">${active.joinCode}</div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-title">🎒 Schüler</div>
        <div id="live-students">${renderLiveStudents(joined, subs)}</div>
      </div>
    </div>`;
  startPoll(active.id);
}

function renderLiveStudents(joined, subs) {
  if (!joined.length) return '<div style="color:var(--ink4);font-size:13px">Noch niemand beigetreten.</div>';
  return joined.map(s => {
    const sub = subs.find(x => x.studentName === s.name);
    return `<div class="stu-row"><div class="stu-av">${s.name.charAt(0).toUpperCase()}</div><div class="stu-name">${esc(s.name)}</div><span class="badge ${sub?'badge-green':'badge-blue'}">${sub?'✓ Abgegeben':'⌛ Läuft'}</span></div>`;
  }).join('');
}

function startPoll(testId) {
  clearInterval(_pollInt);
  _pollInt = setInterval(() => {
    if (!document.getElementById('live-students')) return clearInterval(_pollInt);
    const db = getDB();
    const subs = db.submissions.filter(s => s.testId === testId && s.submitted);
    const joined = db.students.filter(s => s.currentTestId === testId);
    const el = document.getElementById('live-students');
    if (el) el.innerHTML = renderLiveStudents(joined, subs);
    const pct = joined.length ? Math.round(subs.length / joined.length * 100) : 0;
    const jEl = document.getElementById('live-join'); if (jEl) jEl.textContent = joined.length;
    const sEl = document.getElementById('live-subs'); if (sEl) sEl.textContent = subs.length;
    const oEl = document.getElementById('live-open'); if (oEl) oEl.textContent = Math.max(0, joined.length - subs.length);
    const pBar = document.getElementById('live-pct'); if (pBar) pBar.style.width = pct + '%';
    const pLbl = document.getElementById('live-pct-lbl'); if (pLbl) pLbl.textContent = 'Fortschritt ' + pct + '%';
  }, 1500);
}

function addTimeLive(m) {
  _timerSecs = Math.max(0, _timerSecs + m * 60);
  const el = document.getElementById('timer-chip');
  if (el) el.textContent = '⏱ ' + fmt(_timerSecs);
  toast((m > 0 ? '➕' : '➖') + Math.abs(m) + ' Minuten');
}

function endTest(testId) {
  if (!confirm('Test beenden?')) return;
  clearInterval(_timerInt);
  const db = getDB();
  const t = db.tests.find(x => x.id === testId);
  if (t) { t.active = false; t.ended = true; }
  saveDB();
  navTo('subs');
  toast('⏹ Test beendet.');
}

function endTestAuto(testId) {
  clearInterval(_timerInt);
  const db = getDB();
  const t = db.tests.find(x => x.id === testId);
  if (t) { t.active = false; t.ended = true; }
  saveDB();
  toast('⏱ Zeit abgelaufen!');
  navTo('subs');
}

function renderSubs(mine, db) {

        <div class="tc-name">${esc(s.studentName)}</div>
        <div class="tc-meta">${t?esc(t.title):'–'} · ${new Date(s.submittedAt).toLocaleString('de-DE')} · ${sc.scored}/${sc.total} Pt.</div>

      </div>

// ─────────── CORRECT ───────────
function renderCorrect(mine, db) {
  const open = db.submissions.filter(s => mine.find(t => t.id === s.testId) && s.submitted && !s.corrected);
  const done = db.submissions.filter(s => mine.find(t => t.id === s.testId) && s.submitted && s.corrected);
  const el = document.getElementById('correct-list');
  if (!open.length && !done.length) { el.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><div class="empty-text">Noch keine Abgaben.</div></div>'; return; }
  el.innerHTML = (open.length ? `<div class="f-label" style="margin-bottom:10px">Offen (${open.length})</div>` + open.map(s => {
    const t = mine.find(x => x.id === s.testId);
    return `<div class="corr-item" onclick="openCorr('${s.id}')"><div class="stu-av" style="width:40px;height:40px">${s.studentName.charAt(0).toUpperCase()}</div><div class="tc-info"><div class="tc-name">${esc(s.studentName)}</div><div class="tc-meta">${t?esc(t.title):'–'}</div></div><button class="btn btn-primary btn-sm">Korrigieren →</button></div>`;
  }).join('') : '') +
  (done.length ? `<div class="f-label" style="margin:16px 0 10px">Fertig (${done.length})</div>` + done.map(s => {
    const t = mine.find(x => x.id === s.testId);
    return `<div class="corr-item" onclick="openCorr('${s.id}')"><div class="stu-av" style="width:40px;height:40px;background:var(--green-l);color:var(--green)">${s.studentName.charAt(0).toUpperCase()}</div><div class="tc-info"><div class="tc-name">${esc(s.studentName)}</div><div class="tc-meta">${t?esc(t.title):'–'}${s.grade?' · Note: '+esc(s.grade):''}</div></div><span class="badge badge-green">✓</span>${s.sentBack?'<span class="badge badge-blue">✉️</span>':`<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();sendBack('${s.id}')">✉️ Senden</button>`}</div>`;
  }).join('') : '');
}

// ─────────── CORRECTION MODAL ───────────
function openCorr(subId) {
  const db = getDB();
  const sub = db.submissions.find(s => s.id === subId);
  const t = db.tests.find(x => x.id === sub?.testId);
  if (!sub || !t) return;
  const sc = calcScore(sub, t);
  const qs = t.questions || [];

  let qHtml = qs.map((q, i) => {
    const ans = sub.answers?.[q.id];
    let ansHtml = '';
    if (q.type === 'mc') {
      const correct = ans === q.correctIndex;
      ansHtml = (q.options||[]).map((o,oi) => `<div class="ans-row ${ans===oi ? (oi===q.correctIndex?'ans-ok':'ans-wrong') : oi===q.correctIndex?'ans-ok':'ans-neutral'}">${oi===q.correctIndex?'✅':ans===oi?'❌':'○'} ${esc(o)}</div>`).join('');
      ansHtml += `<div style="margin-top:6px"><span class="badge ${correct?'badge-green':'badge-red'}">${correct?'✓ Richtig':'✗ Falsch'} · Auto</span></div>`;
    } else if (q.type === 'multi') {
      const sorted = a => [...(a||[])].sort().join(',');
      const correct = sorted(ans) === sorted(q.correctIndexes);
      ansHtml = (q.options||[]).map((o,oi) => { const sel=(ans||[]).includes(oi); const cor=(q.correctIndexes||[]).includes(oi); return `<div class="ans-row ${sel&&cor?'ans-ok':sel&&!cor?'ans-wrong':cor?'ans-ok':'ans-neutral'}">${cor?'✅':sel?'❌':'☐'} ${esc(o)}</div>`; }).join('');
      ansHtml += `<div style="margin-top:6px"><span class="badge ${correct?'badge-green':'badge-red'}">${correct?'✓ Richtig':'✗ Falsch'} · Auto</span></div>`;
    } else {
      ansHtml = `<div class="answer-peek">${ans?esc(ans):'<em style="color:var(--ink4)">Keine Antwort</em>'}</div>`;
      if (q.modelAnswer) ansHtml += `<div class="alert alert-green" style="margin-bottom:8px;font-size:12px">✅ Musterlösung: ${esc(q.modelAnswer)}</div>`;
      ansHtml += `<div style="display:flex;gap:8px;align-items:center"><label class="f-label" style="margin:0;white-space:nowrap">Punkte (max ${q.points||1}):</label><input type="number" id="pts-${q.id}" min="0" max="${q.points||1}" step="0.5" value="${sub.manualScores?.[q.id]??''}" placeholder="0" style="width:70px;padding:6px 8px;border:1px solid var(--border2);border-radius:7px;font-family:var(--mono);font-size:15px;text-align:center;background:var(--paper);color:var(--ink)"><label class="f-label" style="margin:0;margin-left:8px;white-space:nowrap">Kommentar:</label><input type="text" id="cmt-${q.id}" placeholder="Anmerkung…" value="${esc(sub.comments?.[q.id]||'')}" style="flex:1;padding:6px 10px;border:1px solid var(--border2);border-radius:7px;font-size:12px;font-family:var(--font);background:var(--paper);color:var(--ink)"></div>`;
    }
    return `<div style="background:var(--paper3);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><span class="badge ${q.type==='mc'?'badge-blue':q.type==='multi'?'badge-amber':'badge-green'}">${q.type==='mc'?'MC':q.type==='multi'?'Mehrfach':'Frei'}</span><strong style="font-size:13px;flex:1">${esc(q.question)}</strong><span class="badge badge-gray">${q.points||1} Pt.</span></div>${ansHtml}</div>`;
  }).join('');

  openModal(`<div class="modal-head">✏️ ${esc(sub.studentName)}<button class="modal-close" onclick="closeModal()">✕</button></div>
    <div style="font-size:13px;color:var(--ink3);margin-bottom:1.25rem">${esc(t.title)} · Auto-Score: ${sc.scored}/${sc.total} Pt.</div>
    ${qHtml}
    <div class="field"><label class="f-label">Gesamtfeedback</label><textarea id="overall-fb" class="f-ta" rows="3" placeholder="Allgemeines Feedback…">${esc(sub.feedback||'')}</textarea></div>
    <div class="field"><label class="f-label">Note</label><select id="grade-sel" class="f-sel" style="font-size:20px;font-weight:800;font-family:var(--mono);text-align:center">
      <option value="">– Keine Note –</option>${['1','2','3','4','5','6','1+','1-','2+','2-','3+','3-','4+','4-'].map(g=>`<option value="${g}" ${sub.grade===g?'selected':''}>${g}</option>`).join('')}
    </select></div>
    <div class="field"><label class="f-label">Unterschrift (optional)</label>
      <div class="sig-wrap" id="sig-wrap"><canvas class="sig-canvas" id="sig-canvas" height="150"></canvas>
        <div class="sig-bar">
          <span style="font-size:9px;font-weight:800;color:var(--ink4);text-transform:uppercase;letter-spacing:.7px;margin-right:4px">Farbe:</span>
          ${['#111827','#1e40af','#dc2626','#059669','#7c3aed'].map((c,ci) => `<div class="sig-color ${ci===0?'active':''}" style="background:${c}" onclick="setSigColor('${c}',this)"></div>`).join('')}
          <span style="font-size:9px;font-weight:800;color:var(--ink4);text-transform:uppercase;letter-spacing:.7px;margin-left:8px;margin-right:4px">Stärke:</span>
          <button class="sig-size active" onclick="setSigSize(2,this)">S</button>
          <button class="sig-size" onclick="setSigSize(4,this)">M</button>
          <button class="sig-size" onclick="setSigSize(7,this)">L</button>
          <div style="flex:1"></div>
          <button class="btn btn-ghost btn-sm" onclick="clearSig()">🗑 Löschen</button>
        </div>
      </div>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">
      <button class="btn btn-ghost" onclick="closeModal()">Abbrechen</button>
      <button class="btn btn-primary" onclick="saveCorr('${subId}',false)">💾 Speichern</button>
      <button class="btn btn-green btn-lg" onclick="saveCorr('${subId}',true)">✉️ An Schüler senden</button>
    </div>`);
  setTimeout(() => initSigPad(), 80);
}

function initSigPad() {
  const canvas = document.getElementById('sig-canvas');
  if (!canvas) return;
  const wrap = document.getElementById('sig-wrap');
  canvas.width = wrap?.offsetWidth || 540;
  _sigCtx = canvas.getContext('2d');
  _sigCtx.fillStyle = '#ffffff';
  _sigCtx.fillRect(0, 0, canvas.width, canvas.height);
  _sigCtx.strokeStyle = _sigColor;
  _sigCtx.lineWidth = _sigSize;
  _sigCtx.lineCap = 'round';
  _sigCtx.lineJoin = 'round';

  const gp = e => { const r = canvas.getBoundingClientRect(); const s = e.touches ? e.touches[0] : e; return { x: (s.clientX-r.left)*(canvas.width/r.width), y: (s.clientY-r.top)*(canvas.height/r.height) }; };
  canvas.onmousedown = e => { _sigDrawing=true; const p=gp(e); _sigCtx.beginPath(); _sigCtx.moveTo(p.x,p.y); };
  canvas.onmousemove = e => { if (!_sigDrawing) return; const p=gp(e); _sigCtx.lineTo(p.x,p.y); _sigCtx.stroke(); };
  canvas.onmouseup = canvas.onmouseleave = () => _sigDrawing = false;
  canvas.ontouchstart = e => { e.preventDefault(); _sigDrawing=true; const p=gp(e); _sigCtx.beginPath(); _sigCtx.moveTo(p.x,p.y); };
  canvas.ontouchmove = e => { e.preventDefault(); if (!_sigDrawing) return; const p=gp(e); _sigCtx.lineTo(p.x,p.y); _sigCtx.stroke(); };
  canvas.ontouchend = () => _sigDrawing = false;
}

function setSigColor(c, btn) { _sigColor=c; if (_sigCtx) _sigCtx.strokeStyle=c; document.querySelectorAll('.sig-color').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }
function setSigSize(s, btn) { _sigSize=s; if (_sigCtx) _sigCtx.lineWidth=s; document.querySelectorAll('.sig-size').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }
function clearSig() { const c = document.getElementById('sig-canvas'); if (!c||!_sigCtx) return; _sigCtx.fillStyle='#fff'; _sigCtx.fillRect(0,0,c.width,c.height); }
function getSigData() { const c = document.getElementById('sig-canvas'); if (!c) return null; const b = document.createElement('canvas'); b.width=c.width; b.height=c.height; b.getContext('2d').fillStyle='#fff'; b.getContext('2d').fillRect(0,0,b.width,b.height); return c.toDataURL()===b.toDataURL()?null:c.toDataURL('image/png'); }

function saveCorr(subId, send) {
  const db = getDB();
  const sub = db.submissions.find(s => s.id === subId);
  const t = db.tests.find(x => x.id === sub?.testId);
  if (!sub || !t) return;

  const grade = document.getElementById('grade-sel')?.value || '';
  const overall = document.getElementById('overall-fb')?.value || '';
  const sigData = getSigData();

  const manualScores = {};
  const comments = {};
  (t.questions || []).forEach(q => {
    if (q.type === 'free') {
      const pts = document.getElementById('pts-' + q.id)?.value;
      const cmt = document.getElementById('cmt-' + q.id)?.value;
      if (pts !== '') manualScores[q.id] = parseFloat(pts) || 0;
      if (cmt) comments[q.id] = cmt;
    }
  });

  const sc = calcScore({ ...sub, manualScores }, t);
  let fb = `<div style="background:#eff6ff;border-radius:8px;padding:11px 14px;margin-bottom:10px;border:1px solid #bfdbfe"><strong>Score:</strong> ${sc.scored}/${sc.total} Punkte</div>`;
  if (grade) fb += `<div style="text-align:center;margin-bottom:14px"><div style="width:60px;height:60px;border-radius:50%;background:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#fff">${esc(grade)}</div><div style="font-size:13px;font-weight:700;margin-top:6px">Deine Note</div></div>`;
  if (overall) fb += `<div style="padding:10px;border-radius:8px;font-size:13px;line-height:1.7;margin-bottom:10px;border:1px solid var(--border)"><strong>Feedback:</strong> ${esc(overall)}</div>`;
  Object.entries(comments).forEach(([qid, c]) => { const q = t.questions?.find(x=>x.id===qid); if (q&&c) fb += `<div style="padding:8px 12px;border-radius:7px;margin-bottom:5px;font-size:12px;border:1px solid var(--border)"><strong>${esc(q.question)}:</strong> ${esc(c)}</div>`; });
  if (sigData) fb += `<div style="margin-top:12px"><div style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;color:var(--ink3)">Unterschrift:</div><img src="${sigData}" style="max-width:100%;border:1px solid var(--border);border-radius:8px;background:#fff"></div>`;

  if (grade) sub.grade = grade;
  sub.feedback = overall;
  sub.manualScores = manualScores;
  sub.comments = comments;
  sub.corrected = true;
  sub.returnedFeedback = fb;
  sub.correctedAt = Date.now();
  if (send) sub.sentBack = true;

  saveDB();
  closeModal();
  toast(send ? '✉️ An Schüler gesendet!' : '💾 Gespeichert!');
  renderSection('correct');
}

function sendBack(subId) {
  const db = getDB();
  const sub = db.submissions.find(s => s.id === subId);
  if (!sub) return;
  if (!sub.corrected) { toast('⚠️ Bitte zuerst korrigieren!'); return; }
  sub.sentBack = true;
  saveDB();
  toast('✉️ Gesendet!');
  renderSection('subs');
}

function switchAdminTab(id) {
  document.querySelectorAll('.tabs .tab').forEach((b,i) => b.classList.toggle('active', ['overview','tests','students','teachers'][i]===id));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('at-'+id)?.classList.add('active');
  renderAdminTab(id);
}

function renderAdminTab(id) {
  const db = getDB();
  if (id==='overview') renderAdminOverview(db);
  if (id==='tests') renderAdminTests(db);
  if (id==='students') renderAdminStudents(db);
  if (id==='teachers') renderAdminTeachers(db);
}

function renderAdminOverview(db) {
  const el = document.getElementById('at-overview');
  const ts = db.submissions.length;
  const cor = db.submissions.filter(s => s.corrected).length;
  let sum = 0, cnt = 0;
  db.submissions.forEach(s => { const t = db.tests.find(x=>x.id===s.testId); if(!t)return; const sc=calcScore(s,t); if(sc.total>0){sum+=sc.scored/sc.total*100;cnt++;} });
  const avg = cnt > 0 ? Math.round(sum/cnt) : 0;

  el.innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px">
      <div class="panel" style="text-align:center;padding:14px"><div style="font-size:28px;font-weight:800;color:var(--ink)">${db.tests.length}</div><div style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--ink4);margin-top:4px">Tests</div></div>
      <div class="panel" style="text-align:center;padding:14px"><div style="font-size:28px;font-weight:800;color:var(--green)">${db.tests.filter(t=>t.active).length}</div><div style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--ink4);margin-top:4px">Aktiv</div></div>
      <div class="panel" style="text-align:center;padding:14px"><div style="font-size:28px;font-weight:800;color:var(--ink)">${ts}</div><div style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--ink4);margin-top:4px">Abgaben</div></div>
      <div class="panel" style="text-align:center;padding:14px"><div style="font-size:28px;font-weight:800;color:var(--ink)">${db.students.length}</div><div style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--ink4);margin-top:4px">Schüler</div></div>
      <div class="panel" style="text-align:center;padding:14px"><div style="font-size:28px;font-weight:800;color:var(--accent)">${cor}/${ts}</div><div style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--ink4);margin-top:4px">Korrigiert</div></div>
      <div class="panel" style="text-align:center;padding:14px"><div style="font-size:28px;font-weight:800;color:var(--ink)">${avg}%</div><div style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--ink4);margin-top:4px">⌀ Score</div></div>
      <div class="panel" style="text-align:center;padding:14px"><div style="font-size:28px;font-weight:800;color:var(--ink)">${db.teachers.length}</div><div style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--ink4);margin-top:4px">Lehrkräfte</div></div>
      <div class="panel" style="text-align:center;padding:14px"><div style="font-size:28px;font-weight:800;color:var(--red)">${db.tests.filter(t=>t.ended).length}</div><div style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--ink4);margin-top:4px">Beendet</div></div>
    </div>
    <div class="panel"><div class="panel-title">⚡ Letzte Abgaben</div>
      ${db.submissions.slice().reverse().slice(0,8).map(s => {
        const t = db.tests.find(x=>x.id===s.testId);
        const sc = calcScore(s,t);
        return `<div class="stu-row"><div class="stu-av">${s.studentName.charAt(0).toUpperCase()}</div><div class="tc-info"><div class="stu-name">${esc(s.studentName)}</div><div style="font-size:11px;color:var(--ink3)">${t?esc(t.title):'–'} · ${new Date(s.submittedAt).toLocaleString('de-DE')}</div></div><span class="badge badge-gray">${sc.scored}/${sc.total}Pt.</span>${s.grade?`<span class="badge badge-purple">Note ${esc(s.grade)}</span>`:''}<span class="badge ${s.corrected?'badge-green':'badge-amber'}">${s.corrected?'✓':'⏳'}</span></div>`;
      }).join('') || '<div style="color:var(--ink4);font-size:13px">Noch keine Abgaben.</div>'}
    </div>`;
}

function renderAdminTests(db) {
  document.getElementById('at-tests').innerHTML = `
    <div style="margin-bottom:12px"><input class="f-inp" type="text" id="admin-q" placeholder="🔍 Test suchen…" oninput="filterAdminTests()" style="max-width:300px"></div>
    <div id="admin-tlist"></div>`;
  filterAdminTests();
}

function filterAdminTests() {
  const db = getDB();
  const q = (document.getElementById('admin-q')?.value||'').toLowerCase();
  const tests = db.tests.filter(t => !q || t.title.toLowerCase().includes(q) || (t.teacherName||'').toLowerCase().includes(q));
  document.getElementById('admin-tlist').innerHTML = tests.slice().reverse().map(t => {
    const subs = db.submissions.filter(s => s.testId === t.id);
    const teacher = db.teachers.find(tc => tc.name === t.teacherName);
    const qs = t.questions || [];
    return `<div class="test-card">
      <div class="tc-icon">📝</div>
      <div class="tc-info">
        <div class="tc-name">${esc(t.title)}</div>
        <div class="tc-meta">👩‍🏫 ${esc(t.teacherName||'–')} · ${esc(t.subject||'–')} · Klasse ${esc(t.cls||'–')} · ${qs.length} Fragen · ${subs.length} Abgaben</div>
        ${t.joinCode?`<code style="font-size:11px;font-family:var(--mono);background:var(--paper3);padding:2px 8px;border-radius:5px;color:var(--ink3)">Code: ${t.joinCode}</code>`:''}
      </div>
      <div class="tc-btns">
        <span class="badge ${t.active?'badge-green':t.ended?'badge-red':'badge-gray'}">${t.active?'🟢':t.ended?'🔴':'⚪'}</span>
        <button class="btn btn-ghost btn-sm" onclick="viewAdminAnswers('${t.id}')">📊 Antworten + Musterlösung</button>
        <button class="btn btn-sm" style="background:var(--red-l);color:var(--red);border:1px solid var(--red-m)" onclick="adminDeleteTest('${t.id}')">🗑</button>
      </div>
    </div>`;
  }).join('') || '<div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">Kein Test.</div></div>';
}

function viewAdminAnswers(id) {
  const db = getDB();
  const t = db.tests.find(x => x.id === id);
  if (!t) return;
  const subs = db.submissions.filter(s => s.testId === id);
  const qs = t.questions || [];

  // Musterlösung
  let musterHtml = `<div style="background:var(--accent-l);border:1px solid var(--accent-m);border-radius:var(--r2);padding:16px;margin-bottom:16px">
    <div class="panel-title">✅ Musterlösung</div>
    ${qs.map((q,i) => `<div style="margin-bottom:8px;padding:8px 10px;background:var(--paper);border-radius:8px;border:1px solid var(--border)">
      <div style="font-size:11px;font-weight:700;color:var(--ink3);margin-bottom:4px">F${i+1}: ${esc(q.question)}</div>
      ${q.type==='mc' ? `<div style="color:var(--green);font-weight:700;font-size:13px">✓ ${esc((q.options||[])[q.correctIndex]||'–')}</div>` :
        q.type==='multi' ? `<div style="color:var(--amber);font-weight:700;font-size:13px">✓ ${(q.correctIndexes||[]).map(idx=>esc((q.options||[])[idx]||'')).join(', ')||'–'}</div>` :
        `<div style="color:var(--green);font-size:13px">${q.modelAnswer?esc(q.modelAnswer):'<em style="color:var(--ink4)">Freie Antwort — manuell</em>'}</div>`}
    </div>`).join('')}
  </div>`;

  let subsHtml = subs.map(sub => {
    const sc = calcScore(sub, t);
    return `<div style="background:var(--paper3);border:1px solid var(--border);border-radius:var(--r2);padding:14px;margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <div class="stu-av">${sub.studentName.charAt(0).toUpperCase()}</div>
        <div><div style="font-weight:700;font-size:13px">${esc(sub.studentName)}</div><div style="font-size:11px;color:var(--ink3)">${new Date(sub.submittedAt).toLocaleString('de-DE')} · ${sc.scored}/${sc.total} Pt.</div></div>
        ${sub.grade?`<span class="badge badge-purple" style="margin-left:auto">Note ${esc(sub.grade)}</span>`:''}
        <span class="badge ${sub.corrected?'badge-green':'badge-amber'}">${sub.corrected?'✓':'⏳'}</span>
      </div>
      ${qs.map((q,i) => {
        const ans = sub.answers?.[q.id];
        let ad = '', cor = false;
        if (q.type==='mc') { cor = ans===q.correctIndex; ad = ans!=null?esc((q.options||[])[ans]||'–'):'–'; }
        else if (q.type==='multi') { const sorted = a=>[...(a||[])].sort((a,b)=>a-b).join(','); cor=sorted(ans)===sorted(q.correctIndexes); ad=(ans||[]).map(idx=>esc((q.options||[])[idx]||'')).join(', ')||'–'; }
        else { ad = ans?esc(ans):'–'; }
        return `<div style="margin-bottom:5px"><div style="font-size:10px;font-weight:700;color:var(--ink4);margin-bottom:2px">F${i+1}: ${esc(q.question)} ${q.type!=='free'?`<span style="color:${cor?'var(--green)':'var(--red)'}">${cor?'✅':'❌'}</span>`:''}</div><div class="answer-peek" style="font-size:12px">${ad}</div></div>`;
      }).join('')}
    </div>`;
  }).join('');

  openModal(`<div class="modal-head">📊 ${esc(t.title)}<button class="modal-close" onclick="closeModal()">✕</button></div>
    ${musterHtml}
    ${subs.length?subsHtml:'<div style="color:var(--ink4)">Noch keine Abgaben.</div>'}
    <div style="text-align:right"><button class="btn btn-ghost" onclick="closeModal()">Schließen</button></div>`);
}

function adminDeleteTest(id) {
  if (!confirm('Test löschen?')) return;
  const db = getDB();
  db.tests = db.tests.filter(t => t.id !== id);
  db.submissions = db.submissions.filter(s => s.testId !== id);
  saveDB();
  toast('🗑 Gelöscht.');
  filterAdminTests();
}

function renderAdminStudents(db) {
  document.getElementById('at-students').innerHTML = db.students.length ?
    db.students.map(stu => {
      const subs = db.submissions.filter(s => s.studentName === stu.name);
      return `<div class="test-card"><div class="stu-av" style="width:38px;height:38px;flex-shrink:0">${stu.name.charAt(0).toUpperCase()}</div><div class="tc-info"><div class="tc-name">${esc(stu.name)}</div><div class="tc-meta">${subs.length} Abgabe${subs.length!==1?'n':''}</div></div><button class="btn btn-sm" style="background:var(--red-l);color:var(--red);border:1px solid var(--red-m)" onclick="adminDelStudent('${encodeURIComponent(stu.name)}')">🗑</button></div>`;
    }).join('') :
    '<div class="empty"><div class="empty-icon">🎒</div><div class="empty-text">Noch keine Schüler.</div></div>';
}

function adminDelStudent(name) {
  if (!confirm('Schüler löschen?')) return;
  const n = decodeURIComponent(name);
  const db = getDB();
  db.students = db.students.filter(s => s.name !== n);
  db.submissions = db.submissions.filter(s => s.studentName !== n);
  saveDB();
  toast('🗑 Gelöscht.');
  renderAdminStudents(getDB());
}

function renderAdminTeachers(db) {
  document.getElementById('at-teachers').innerHTML = db.teachers.length ?
    db.teachers.map(t => {
      const tests = db.tests.filter(x => x.teacherName === t.name);
      return `<div class="test-card"><div class="stu-av" style="width:38px;height:38px;flex-shrink:0">${t.name.charAt(0).toUpperCase()}</div><div class="tc-info"><div class="tc-name">${esc(t.name)}</div><div class="tc-meta">${esc(t.city||'–')} · ${tests.length} Tests · Zuletzt: ${t.lastSeen?new Date(t.lastSeen).toLocaleDateString('de-DE'):'–'}</div></div><button class="btn btn-sm" style="background:var(--red-l);color:var(--red);border:1px solid var(--red-m)" onclick="adminDelTeacher('${encodeURIComponent(t.name)}')">🗑</button></div>`;
    }).join('') :
    '<div class="empty"><div class="empty-icon">👩‍🏫</div><div class="empty-text">Noch keine Lehrkräfte.</div></div>';
}

function adminDelTeacher(name) {
  if (!confirm('Lehrkraft löschen?')) return;
  const n = decodeURIComponent(name);
  const db = getDB();
  db.teachers = db.teachers.filter(t => t.name !== n);
  saveDB();
  toast('🗑 Gelöscht.');
  renderAdminTeachers(getDB());
}

function exportAll() {
  const data = JSON.stringify(getDB(), null, 2);
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(data);
  a.download = 'fusion-export-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  toast('📦 Export gespeichert.');
}

function resetAll() {
  if (!confirm('ALLE Daten löschen?')) return;
  if (!confirm('Wirklich alles zurücksetzen?')) return;
  localStorage.removeItem(STORE_KEY);
  _db = null;
  toast('✅ Zurückgesetzt.');
  renderAdminTab('overview');
}

// ─────────── MODAL ───────────
function openModal(html) {
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal-bg').classList.add('open');
}
function closeModal() {
  document.getElementById('modal-bg').classList.remove('open');
}

// ─────────── BOOT ───────────
init();

// Keyboard shortcut: Enter on login
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('l-name')?.addEventListener('keydown', e => { if (e.key==='Enter') document.getElementById('l-city')?.focus(); });
  document.getElementById('l-city')?.addEventListener('keydown', e => { if (e.key==='Enter') document.getElementById('l-pass')?.focus(); });
});
</script>
